# Spec for `nemo memory export`.
#
# Extracts the 40-entry Sonnet 4.5 vs Nemotron-Nano disagreement set
# from the Phase 1 v1 triage artifact and emits a labeled JSONL ready
# for fine-tuning Nemotron-Nano against Sonnet's calibration.
#
# This is the bd mdubrinsky-7au.3 deliverable. The output is the
# training data for "tune Nano to behave like Sonnet on the boundary
# cases" — the entries where Nano's not-invented-here refines diverge
# from Sonnet's calibrated keep/promote/refine balance.
#
# Run on omnistation (after `git pull && uv sync`):
#
#   # 1. Ship the Phase 1 v1 artifact + corpus to filesets on omnistation:
#   #    The artifact lives in-repo; the corpus is in ~/.pi/agent/.
#   nemo --context omnistation files upload \
#       plugins/nemo-agents/src/nemo_agents_plugin/improvement/memory/phase1-smoke/triage-user.json \
#       memory-triage-phase1-v1
#   nemo --context omnistation files upload \
#       ~/.pi/agent/claude-session-replays/CONSOLIDATED/USER.md \
#       user-memory-corpus  # may already exist from earlier triage runs
#
#   # 2. Run the export job.
#   nemo memory export run \
#       --spec-file plugins/nemo-memory/examples/triage/export-v1-disagreements.export.yml
#
#   # 3. Back on the laptop, pull the corpus:
#   nemo --context omnistation files download memory-triage-finetune-corpora -o ./finetune

triage_artifact: memory-triage-phase1-v1
corpus: user-memory-corpus
workspace: default

# Sonnet 4.5 is the reference here because it's what the v1 artifact has.
# When a fresh Sonnet 4.6 + Nano triage lands we'd switch to 4.6 for
# tighter alignment with the locked Phase 1 baseline.
reference_judge: azure-anthropic-claude-sonnet-4-5
candidate_judge: nvidia-nvidia-nemotron-3-nano-30b-a3b
only_disagreements: true

output: memory-triage-finetune-corpora
basename: v1-sonnet45-vs-nano-disagreements
