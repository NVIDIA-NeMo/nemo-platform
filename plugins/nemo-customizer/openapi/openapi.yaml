components:
  schemas:
    Automodel.jobsJobsListFilter:
      additionalProperties: false
      properties:
        created_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Jobs created at 'gte' datetime or 'lte' datetime.
        name:
          anyOf:
          - $ref: '#/components/schemas/StringFilter'
          - type: string
          description: Name of the job.
          title: Name
        workspace:
          description: Workspace of the job.
          title: Workspace
          type: string
        project:
          description: Project containing the job.
          title: Project
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/PlatformJobStatus'
          description: The current status.
        updated_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Jobs updated at 'gte' datetime or 'lte' datetime.
      title: Automodel.jobsJobsListFilter
      type: object
    AutomodelJobInput:
      properties:
        name:
          title: Name
          type: string
        model:
          type: string
          title: Model
        dataset:
          $ref: '#/components/schemas/DatasetSpec'
        training:
          $ref: '#/components/schemas/TrainingSpec'
        schedule:
          $ref: '#/components/schemas/ScheduleSpec'
        batch:
          $ref: '#/components/schemas/BatchSpec'
        optimizer:
          $ref: '#/components/schemas/OptimizerSpec'
        parallelism:
          $ref: '#/components/schemas/ParallelismSpec'
        output:
          $ref: '#/components/schemas/OutputRequest'
        integrations:
          $ref: '#/components/schemas/IntegrationsSpecInput'
      additionalProperties: false
      type: object
      required:
      - model
      - dataset
      - training
      title: AutomodelJobInput
      description: POST body / CLI JSON.
    AutomodelJobOutput:
      properties:
        name:
          title: Name
          type: string
        model:
          type: string
          title: Model
        dataset:
          $ref: '#/components/schemas/DatasetSpec'
        training:
          $ref: '#/components/schemas/TrainingSpec'
        schedule:
          $ref: '#/components/schemas/ScheduleSpec'
        batch:
          $ref: '#/components/schemas/BatchSpec'
        optimizer:
          $ref: '#/components/schemas/OptimizerSpec'
        parallelism:
          $ref: '#/components/schemas/ParallelismSpec'
        output:
          $ref: '#/components/schemas/OutputResponse'
        integrations:
          $ref: '#/components/schemas/IntegrationsSpecOutput'
      additionalProperties: false
      type: object
      required:
      - model
      - dataset
      - training
      - schedule
      - batch
      - optimizer
      - parallelism
      - output
      title: AutomodelJobOutput
      description: Stored canonical spec after ``to_spec()``.
    BatchSpec:
      properties:
        global_batch_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Global Batch Size
          default: 8
        micro_batch_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Micro Batch Size
          default: 1
        sequence_packing:
          type: boolean
          title: Sequence Packing
          default: false
        sequence_packing_max_samples:
          type: integer
          exclusiveMinimum: 0.0
          title: Sequence Packing Max Samples
          description: Samples analyzed to estimate the optimal pack size when packing
            is enabled.
          default: 1000
      additionalProperties: false
      type: object
      title: BatchSpec
    DatasetSpec:
      properties:
        training:
          type: string
          title: Training
          description: Training fileset as 'name' or 'workspace/name'.
        validation:
          title: Validation
          type: string
        prompt_template:
          title: Prompt Template
          type: string
      additionalProperties: false
      type: object
      required:
      - training
      title: DatasetSpec
    DatetimeFilter:
      additionalProperties: false
      properties:
        $gte:
          description: Filter for results greater than or equal to this datetime.
          title: $Gte
          format: date-time
          type: string
        $lte:
          description: Filter for results less than or equal to this datetime.
          title: $Lte
          format: date-time
          type: string
      title: DatetimeFilter
      type: object
    FileStorageType:
      type: string
      enum:
      - fileset
      title: FileStorageType
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IntegrationsSpecInput:
      properties:
        wandb:
          allOf:
          - $ref: '#/components/schemas/WandbIntegration'
          description: Weights & Biases integration configuration.
        mlflow:
          allOf:
          - $ref: '#/components/schemas/MlflowIntegration'
          description: MLflow integration configuration.
      additionalProperties: false
      type: object
      title: IntegrationsSpecInput
      description: 'Third-party experiment-tracking integrations for a job spec.


        Each integration is requested by presence: omit or set a field to ``null``
        to

        disable it. Activation at training time still requires credentials/URIs

        (see compile-time warnings and runtime builders).'
    IntegrationsSpecOutput:
      properties:
        wandb:
          allOf:
          - $ref: '#/components/schemas/WandbIntegration'
          description: Weights & Biases integration configuration.
        mlflow:
          allOf:
          - $ref: '#/components/schemas/MlflowIntegration'
          description: MLflow integration configuration.
      additionalProperties: false
      type: object
      title: IntegrationsSpecOutput
      description: 'Third-party experiment-tracking integrations for a job spec.


        Each integration is requested by presence: omit or set a field to ``null``
        to

        disable it. Activation at training time still requires credentials/URIs

        (see compile-time warnings and runtime builders).'
    LoRAParams:
      properties:
        rank:
          type: integer
          exclusiveMinimum: 0.0
          title: Rank
          default: 16
        alpha:
          type: integer
          exclusiveMinimum: 0.0
          title: Alpha
          default: 32
        dropout:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Dropout
          description: LoRA dropout probability for regularization.
          default: 0.0
        merge:
          type: boolean
          title: Merge
          default: false
        target_modules:
          title: Target Modules
          items:
            type: string
          type: array
        exclude_modules:
          title: Exclude Modules
          description: Module name patterns to exclude from LoRA (e.g. ['*.out_proj']).
          items:
            type: string
          type: array
        use_triton:
          type: boolean
          title: Use Triton
          description: Use the optimized Triton LoRA kernel.
          default: true
      additionalProperties: false
      type: object
      title: LoRAParams
    MlflowIntegration:
      properties:
        experiment_name:
          title: Experiment Name
          description: MLflow experiment name (groups related runs). Defaults to output.name
            if not set.
          type: string
        name:
          title: Name
          description: MLflow run name. Defaults to job_id if not provided.
          type: string
        tags:
          title: Tags
          description: MLflow tags as key-value pairs for filtering runs.
          additionalProperties:
            type: string
          type: object
        description:
          title: Description
          description: MLflow run description.
          type: string
        tracking_uri:
          title: Tracking Uri
          description: MLflow tracking server URI (e.g., 'http://mlflow.mycompany.com:5000').
            Can also be set via MLFLOW_TRACKING_URI environment variable.
          type: string
      additionalProperties: false
      type: object
      title: MlflowIntegration
      description: 'MLflow integration configuration.


        To enable MLflow, provide a non-null ``mlflow`` object on :class:`IntegrationsSpec`.'
    OptimizerSpec:
      properties:
        learning_rate:
          type: number
          exclusiveMinimum: 0.0
          title: Learning Rate
          default: 5.0e-06
        min_learning_rate:
          title: Min Learning Rate
          description: Minimum learning rate for the cosine decay schedule.
          type: number
          minimum: 0.0
        weight_decay:
          type: number
          minimum: 0.0
          title: Weight Decay
          default: 0.01
        adam_beta1:
          type: number
          exclusiveMaximum: 1.0
          minimum: 0.0
          title: Adam Beta1
          description: Adam optimizer beta1.
          default: 0.9
        adam_beta2:
          type: number
          exclusiveMaximum: 1.0
          minimum: 0.0
          title: Adam Beta2
          description: Adam optimizer beta2.
          default: 0.999
        warmup_steps:
          type: integer
          minimum: 0.0
          title: Warmup Steps
          default: 0
        adam_eps:
          type: number
          exclusiveMinimum: 0.0
          title: Adam Eps
          description: Adam/AdamW epsilon for numerical stability.
          default: 1.0e-08
        optimizer:
          type: string
          enum:
          - Adam
          - AdamW
          title: Optimizer
          description: Optimizer algorithm.
          default: Adam
        lr_decay_style:
          type: string
          enum:
          - cosine
          - linear
          - constant
          title: Lr Decay Style
          description: Learning-rate decay schedule.
          default: cosine
      additionalProperties: false
      type: object
      title: OptimizerSpec
    OutputRequest:
      properties:
        name:
          type: string
          title: Name
        description:
          title: Description
          type: string
      additionalProperties: false
      type: object
      required:
      - name
      title: OutputRequest
    OutputResponse:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          enum:
          - model
          - adapter
          title: Type
        fileset:
          type: string
          title: Fileset
        description:
          title: Description
          type: string
      additionalProperties: false
      type: object
      required:
      - name
      - type
      - fileset
      title: OutputResponse
    PaginationData:
      properties:
        page:
          type: integer
          title: Page
          description: The current page number.
        page_size:
          type: integer
          title: Page Size
          description: The page size used for the query.
        current_page_size:
          type: integer
          title: Current Page Size
          description: The size for the current page.
        total_pages:
          type: integer
          title: Total Pages
          description: The total number of pages.
        total_results:
          type: integer
          title: Total Results
          description: The total number of results.
      type: object
      required:
      - page
      - page_size
      - current_page_size
      - total_pages
      - total_results
      title: PaginationData
    ParallelismSpec:
      properties:
        num_nodes:
          type: integer
          exclusiveMinimum: 0.0
          title: Num Nodes
          default: 1
        num_gpus_per_node:
          type: integer
          exclusiveMinimum: 0.0
          title: Num Gpus Per Node
          default: 1
        tensor_parallel_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Tensor Parallel Size
          default: 1
        pipeline_parallel_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Pipeline Parallel Size
          default: 1
        context_parallel_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Context Parallel Size
          default: 1
        expert_parallel_size:
          title: Expert Parallel Size
          type: integer
          exclusiveMinimum: 0.0
        sequence_parallel:
          type: boolean
          title: Sequence Parallel
