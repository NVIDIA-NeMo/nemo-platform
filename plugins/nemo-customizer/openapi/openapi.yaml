          title: Steps
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - name
      - status
      - status_details
      - error_details
      - steps
      - created_at
      - updated_at
      title: PlatformJobStatusResponse
    PlatformJobStepStatusResponse:
      properties:
        id:
          type: string
          title: Id
