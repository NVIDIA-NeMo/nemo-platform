          type: number
          maximum: 1.0
          minimum: 0.0
          title: Distillation Ratio
          default: 0.5
        distillation_temperature:
          type: number
          exclusiveMinimum: 0.0
          title: Distillation Temperature
          default: 1.0
        teacher_precision:
          type: string
          enum:
