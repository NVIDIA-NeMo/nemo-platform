apiVersion: v1
kind: Pod
metadata:
  name: test-unsloth-anubhutiv
  namespace: anubhutiv-test
  labels:
    app: test-unsloth
    user: anubhutiv
spec:
  restartPolicy: Never
  containers:
    - name: gpu-test-unsloth
      # CUDA 12.6 + cuDNN devel — Unsloth supports 12.1/12.4/12.6/12.8 reliably.
      # `devel` includes nvcc which a few unsloth quant kernels JIT-build at first use.
      image: nvcr.io/nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04
      command: ["sleep", "infinity"]
      resources:
        limits:
          nvidia.com/gpu: 1
          memory: 32Gi
          cpu: "8"
        requests:
          memory: 16Gi
          cpu: "4"
      env:
        # HuggingFace and pip caches under /workspace so they survive pod restarts
        # when the volume is upgraded to a PVC; with emptyDir they reset per-pod.
        - name: HF_HOME
          value: /workspace/.cache/huggingface
        - name: PIP_CACHE_DIR
          value: /workspace/.cache/pip
        - name: UV_CACHE_DIR
          value: /workspace/.cache/uv
        # Python 3.11 keeps the platform's `>=3.11,<3.14` constraint happy.
        - name: PYTHON_VERSION
          value: "3.11"
      volumeMounts:
        - mountPath: /workspace
          name: workspace
        # /dev/shm — PyTorch DataLoader workers need shared memory; emptyDir default is 64Mi.
        - mountPath: /dev/shm
          name: dshm
  volumes:
    - name: workspace
      emptyDir:
        sizeLimit: 100Gi
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 8Gi
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
