[project]
name = "nemo-customizer-plugin"
version = "0.1.0"
description = "Local fine-tuning plugin for the NeMo Platform. Backend dispatch (unsloth implemented; automodel and megatron-bridge stubbed)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "nemo-platform-plugin",
    "nemo-platform",
    "pydantic>=2.0.0",
    "typer>=0.12.5",
]

[project.optional-dependencies]
# Each extra installs ONLY the backend deps. The plugin itself is always
# installed via the base `nemo-customizer-plugin` package. Auto-resolution
# in venv_resolver.py maps JobSpec → extra name → `pip install
# nemo-customizer-plugin[<extra>]`.
unsloth = [
    "unsloth",
    "trl>=0.7",
    "transformers>=4.40",
    "datasets",
    "peft",
    "accelerate",
    "bitsandbytes",
]
# Placeholders — local backends not implemented; remote service handles these today.
automodel = []
megatron-bridge = []
all = ["nemo-customizer-plugin[unsloth,automodel,megatron-bridge]"]

[tool.uv.sources]
nemo-platform = { path = "../../packages/nemo_platform", editable = true }
nemo-platform-plugin = { path = "../../packages/nemo_platform_plugin", editable = true }

[project.entry-points."nemo.cli"]
customizer = "nemo_customizer_plugin.cli:CustomizerCLI"

[project.entry-points."nemo.jobs"]
"customizer.finetune" = "nemo_customizer_plugin.jobs.finetune:FinetuneJob"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_customizer_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
