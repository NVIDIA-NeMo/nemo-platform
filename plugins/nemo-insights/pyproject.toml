[project]
name = "nemo-insights-plugin"
version = "0.1.0"
description = "NeMo Insights Plugin — data model and CRUD for analyst-produced agent insights."
requires-python = ">=3.11,<3.14"
dependencies = [
    "nemo-platform-plugin",
    "nemo-platform",
    "pydantic>=2.10.6",
    "typer>=0.12.5",
    "httpx>=0.27",
]

[project.entry-points."nemo.services"]
insights = "nemo_insights_plugin.service:InsightsPluginService"

[project.entry-points."nemo.cli"]
insights = "nemo_insights_plugin.cli:InsightsPluginCLI"

[project.entry-points."nemo.sdk"]
insights = "nemo_insights_plugin.sdk:insights_sdk_resources"

[project.entry-points."nemo.skills"]
insights = "nemo_insights_plugin.skills:get_skills_path"

[tool.uv.sources]
nemo-platform = { workspace = true }
nemo-platform-plugin = { workspace = true }
nmp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_insights_plugin"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

# Opt this plugin into OpenAPI spec generation
[tool.nemo.openapi]
