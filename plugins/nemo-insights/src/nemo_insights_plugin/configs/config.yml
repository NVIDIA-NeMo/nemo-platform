# NeMo Insights Plugin - Analyst Agent Workflow
#
# Standalone NAT workflow for the onboarding and analysis agent.
#
# Run locally:
#   export NVIDIA_API_KEY=nvapi-...
#   nat serve --config_file plugins/nemo-insights/src/nemo_insights_plugin/configs/config.yml
#
# The agent auto-detects whether a user has been onboarded (SOUL.md exists)
# and either runs the onboarding interview or operates in analyst mode.

functions:
  onboarding_gate:
    _type: onboarding_gate
    data_dir: ${INSIGHTS_DATA_DIR:-~/.nemo-insights}
    # Pre-populated from NeMo Platform agent registration when available.
    # Pass via --override or env vars (e.g. INSIGHTS_AGENT_NAME).
    agent_name: ${INSIGHTS_AGENT_NAME:-}
    agent_description: ${INSIGHTS_AGENT_DESCRIPTION:-}
  memory_writer:
    _type: memory_writer
    data_dir: ${INSIGHTS_DATA_DIR:-~/.nemo-insights}

llms:
  llm:
    _type: openai
    api_key: ${NVIDIA_API_KEY}
    model_name: ${NEMO_DEFAULT_MODEL:-nvidia/nemotron-3-nano-30b-a3b}
    temperature: 0.7

workflow:
  _type: tool_calling_agent
  tool_names: [onboarding_gate, memory_writer]
  llm_name: llm
  verbose: false
  max_history: 30
