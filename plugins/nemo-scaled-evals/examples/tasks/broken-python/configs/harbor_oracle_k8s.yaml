# Harbor-on-K8s: OpenThoughts-TBLite broken-python oracle smoke.
# Comparable to gym_* broken-python smokes (same task, same oracle agent).
#
# ${...} are filled by dispatch (envsubst from targets/<target>.env).
#
# Requires TASK_IMAGE (built task environment) — sandbox-k8s defaults to UBI
# python-312-minimal when image is omitted, which is not the broken-python env.
job_name: broken-python-oracle
jobs_dir: jobs/sandbox-k8s
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1.0

retry:
  max_retries: 2
  include_exceptions:
    - EnvironmentStartTimeoutError
    - SandboxCreationError
    - SandboxExecutionError
    - SandboxNotFoundError
    - SandboxTimeoutError
    - DownloadVerifierDirError
    - AddTestsDirError

environment:
  import_path: sandbox_k8s.harbor:K8sSandboxEnvironment
  delete: true
  env:
    HOME: /app
    PIP_USER: "1"
  kwargs:
    namespace: ${SANDBOX_NAMESPACE}
    kubeconfig_path: ${HOME}/.kube/config
    context: ${SANDBOX_CONTEXT}
    # Sandbox readiness only. Harbor trial and command timeouts are separate.
    timeout: 600
    # FOOTGUN: working_dir is ALSO the mount point of the writable emptyDir
    # ("workspace") volume the K8s adapter mounts, so it SHADOWS whatever the
    # image ships at this path. The pod runs readOnlyRootFilesystem,
    # so this emptyDir is the task's writable scratch dir. /app is correct here
    # because python:slim's /app is empty and the task needs it writable for
    # `pip install --user`. Images that ship CONTENT at /app (e.g. a NeMo base
    # with a venv under /app/.venv) must instead use the adapter default
    # working_dir: /workspace — otherwise that content vanishes at runtime.
    working_dir: /app
    image: ${TASK_IMAGE}
    image_pull_policy: Always
    run_as_user: 1000
    run_as_group: 1000
    fs_group: 1000
    # The control-plane build (finalize) pushes the task image to a private
    # registry; dispatch binds it onto image: via spec.image_ref, so the oracle
    # path now forwards the namespace pull secret too (mirrors the claude-code
    # config). Harmless when image: is a public image.
    image_pull_secrets: ${TASK_IMAGE_PULL_SECRET}
    verify_ssl: ${VERIFY_SSL}
    # Kept for adapter compatibility. Effective egress is provided by
    # examples/agent-sandbox/k8s/egress-allow-networkpolicy.yaml when a real
    # agent or per-run Switchyard is used; the oracle path itself does not make
    # model calls.
    network_policy:
      egress:
        - {}
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

agents:
  - name: oracle

tasks:
  - path: ${BROKEN_PYTHON_TASK_PATH}
