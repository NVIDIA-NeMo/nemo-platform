harbor_agent:
  responses_api_agents:
    harbor_agent:
      entrypoint: app.py
      domain: agent
      description: Harbor terminus-2 on OpenThoughts-TBLite broken-python (Daytona).
      concurrency: 1

      harbor_datasets:
        openthoughts_tblite:
          dataset_name: "openthoughts-tblite"
          dataset_version: "2.0"

      harbor_agent_name: "terminus-2"
      harbor_agent_import_path: null
      harbor_agent_kwargs:
        max_turns: 20

      harbor_environment_type: "daytona"
      harbor_environment_import_path: null
      harbor_environment_kwargs:
        network_block_all: false

      model_server:
        type: responses_api_models
        name: policy_model

      harbor_jobs_dir: "responses_api_agents/harbor_agent/jobs"
