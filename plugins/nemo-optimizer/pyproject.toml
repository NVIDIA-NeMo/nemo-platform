[project]
name = "nemo-optimizer-plugin"
version = "0.1.0"
description = "NeMo Optimizer plugin scaffold for NeMo Platform."
requires-python = ">=3.11,<3.14"
dependencies = [
    "nemo-platform-plugin",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_optimizer_plugin"]

[tool.uv.sources]
nemo-platform-plugin = { path = "../../packages/nemo_platform_plugin", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
