[project]
name = "nemo-datasets-plugin"
description = "Dataset profiler for NeMo Platform filesets."
requires-python = ">=3.11,<3.15"
dependencies = [
    "nemo-platform-plugin",
    "pyarrow>=17.0.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.3",
    "typer>=0.20.0,<0.26",
]
version = "0.1.0"

[tool.uv.sources]
nemo-platform-plugin = { workspace = true }

[project.entry-points."nemo.cli"]
datasets = "nemo_datasets_plugin.cli:DatasetsCLI"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_datasets_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
