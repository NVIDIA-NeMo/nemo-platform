[project]
name = "nemo-iron-swarm-plugin"
version = "0.1.0"
description = "Iron Swarm plugin for NeMo Platform — red-team and harden deployed NAT agents."
requires-python = ">=3.11,<3.15"
# NOTE: iron-swarm is intentionally NOT a dependency here. It pins garak==0.15.1 and
# requires-python <3.13, and only resolves with a root-level httpx override — embedding it
# would constrain the whole monorepo. Instead it is installed into its own venv by
# `nemo iron-swarm setup` and invoked by subprocess. See the plan/memory for the spike verdict.
dependencies = [
    "nemo-platform-plugin",
    "nemo-platform",
    # For the Agent entity, so a run's hardened workflow can be adopted into the agent config
    # (POST /runs/{name}/apply-mitigation). Same-process entity-store update — no cross-service call.
    "nemo-agents-plugin",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
    "typer>=0.20.0",
    "httpx>=0.27",
]

[project.entry-points."nemo.services"]
iron-swarm = "nemo_iron_swarm_plugin.service:IronSwarmPluginService"

[project.entry-points."nemo.cli"]
iron-swarm = "nemo_iron_swarm_plugin.cli.main:IronSwarmCLI"

[project.entry-points."nemo.jobs"]
# Named "war-game" so the auto job group doesn't shadow the hand-written `iron-swarm run --config`.
"iron-swarm.war-game" = "nemo_iron_swarm_plugin.jobs.run:IronSwarmRunJob"
# Named "synth" so the auto job group doesn't shadow the hand-written `iron-swarm synth-benign`.
"iron-swarm.synth" = "nemo_iron_swarm_plugin.jobs.synth_benign:IronSwarmSynthBenignJob"

[project.entry-points."nemo.sdk"]
# Underscore: the nemo.sdk key is the client attribute name (`client.iron_swarm`); a hyphen never matches.
iron_swarm = "nemo_iron_swarm_plugin.sdk:iron_swarm_sdk_resources"

[project.entry-points."nemo.skills"]
iron-swarm = "nemo_iron_swarm_plugin.skills:get_skills_path"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_iron_swarm_plugin"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.11.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src"]

# Opt this plugin into OpenAPI spec generation
[tool.nemo.openapi]
