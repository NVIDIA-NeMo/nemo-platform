# Harbor-on-K8s hello-world oracle smoke.
# Exercises the task image and verifier path without making model calls.
#
# ${...} are filled by dispatch (envsubst from targets/<target>.env).
#
# Requires TASK_IMAGE so this smoke verifies the image produced by finalize.
job_name: hello-world-oracle
jobs_dir: jobs/sandbox-k8s
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1.0

retry:
  max_retries: 2
  include_exceptions:
    - EnvironmentStartTimeoutError
    - SandboxCreationError
    - SandboxExecutionError
    - SandboxNotFoundError
    - SandboxTimeoutError
    - DownloadVerifierDirError
    - AddTestsDirError

environment:
  import_path: sandbox_k8s.harbor:K8sSandboxEnvironment
  delete: true
  env:
    HOME: /app
    PIP_USER: "1"
  kwargs:
    namespace: ${SANDBOX_NAMESPACE}
    kubeconfig_path: ${HOME}/.kube/config
    context: ${SANDBOX_CONTEXT}
    # Sandbox readiness only. Harbor trial and command timeouts are separate.
    timeout: 600
    # This path is backed by the sandbox's writable workspace volume.
    working_dir: /app
    image: ${TASK_IMAGE}
    image_pull_policy: Always
    run_as_user: 1000
    run_as_group: 1000
    fs_group: 1000
    # The control-plane build (finalize) pushes the task image to a private
    # registry; dispatch binds it onto image: via spec.image_ref, so the oracle
    # path now forwards the namespace pull secret too (mirrors the claude-code
    # config). Harmless when image: is a public image.
    image_pull_secrets: ${TASK_IMAGE_PULL_SECRET}
    verify_ssl: ${VERIFY_SSL}
    # Safe default for direct Harbor use. Scaled-evals dispatch replaces this
    # with its authoritative k8s_network_policy for the requested run policy.
    network_policy:
      policyTypes:
        - Egress
      egress: []
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

agents:
  - name: oracle

tasks:
  - path: ${TASK_PATH}
