[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemo-optimization-example-phishing-analyzer"
version = "0.1.0"
description = "Deterministic phishing-analyzer MCP server for the hermes-optimize MCP example."
requires-python = ">=3.11,<3.15"
dependencies = [
    "mcp>=1.28.1,<2",
]

[project.scripts]
phishing-analyzer-mcp = "phishing_analyzer_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["phishing_analyzer_mcp"]
