# Optimizer/eval overlay only. Merge with agent.yaml via a platform agent
# reference (`--agent <name>`) or use the self-contained packages:
#   phishing.optimize.fabric-chatonly.yaml
#   phishing.optimize.fabric-mcp.e2e.yaml
#
# Optional per-task Fabric lifecycle hook:
#
# eval:
#   run_hook:
#     type: mcp_run_binding
#     agent_src: ${AGENT_SRC}
#     bindings:
#       - server: my-mcp
#         binding: my_pkg.audit:RunBinding
#         executable: ${AGENT_MCP_BIN}
#
# Or: ref: "my_pkg.hooks:MyHook"  |  path+attr  |  type: <nemo.fabric.task_hooks entry point>
# See README.md in this directory.
optimizer:
  numeric:
    enabled: true
    n_trials: 2
  reps_per_param_set: 1
  eval_metrics:
    average_score:
      evaluator_name: average_score
      direction: maximize
      weight: 1.0
  search_space:
    temperature:
      type: fabric
      path: models.default.temperature
      values: [0.0, 0.2]
eval:
  general:
    dataset:
      file_path: plugins/nemo-optimization/examples/hermes-optimize/dataset.json
    max_concurrency: 1
  fabric:
    base_dir: plugins/nemo-optimization/examples/hermes-optimize
    capture_trajectory: true
    timeout_s: 300
  evaluators:
    accuracy:
      _type: tunable_rag_evaluator
      llm_name: judge
      default_scoring: true
      default_score_weights:
        coverage: 0.5
        correctness: 0.3
        relevance: 0.2
      judge_llm_prompt: >
        Score whether the generated answer correctly addresses the question
        compared to the expected answer. Return JSON only.
