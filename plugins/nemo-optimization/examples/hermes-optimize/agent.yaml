# Minimal Hermes Fabric package for numeric optimize (golden-path shape).
# Inspired by email-phishing-analyzer Hermes harnesses; no MCP binding required
# for this smoke-oriented example.
#
#   nemo agents optimize run \
#     --optimize-config plugins/nemo-optimization/examples/hermes-optimize/optimize.yaml \
#     --agent-config plugins/nemo-optimization/examples/hermes-optimize/agent.yaml
schema_version: fabric.agent/v1alpha1
metadata:
  name: hermes-optimize-demo
  description: Hermes-backed numeric HPO demo agent (chat-only).
harness:
  adapter_id: nvidia.fabric.hermes
  resolution: preinstalled
  settings:
    max_tokens: 512
    reasoning_config:
      effort: none
models:
  default:
    provider: openai
    model: REPLACE_ME
    base_url: REPLACE_ME
    api_key: not-used
    allow_empty_api_key: true
    temperature: 0.0
    top_p: 1.0
  judge:
    provider: openai
    model: REPLACE_ME
    base_url: REPLACE_ME
    api_key: not-used
    allow_empty_api_key: true
    temperature: 0.0
    max_tokens: 512
instructions:
  system:
    content: >
      Answer the user's question in one short sentence. Prefer factual,
      concise replies.
runtime:
  input_schema: chat
  output_schema: message
  max_turns: 4
  timeout_seconds: 60
  artifacts: ./artifacts
environment:
  provider: local
  workspace: ./.tmp/workspace
  artifacts: ./artifacts
