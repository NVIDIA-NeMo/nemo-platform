[project]
name = "nemo-experimentalist-plugin"
version = "0.1.0"
description = "NeMo Experimentalist plugin for NeMo Platform."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2",
    "httpx",
    "harbor>=0.16",
    "opentelemetry-proto>=1.42.1",
    "protobuf>=6.0.0",
    "nooa",
    "pyyaml>=6.0.3",
    "nemo-eval-author-plugin",
    "nemo-insights-plugin",
    "nemo-platform",
    "nemo-platform-plugin",
    "tomlkit>=0.13.3",
]

[project.entry-points."nemo.cli.agents"]
experimentalist = "nemo_experimentalist_plugin.cli:ExperimentalistCLI"

[project.entry-points."nemo.skills"]
experimentalist = "nemo_experimentalist_plugin.skills:skills_dir"

# Our own components are discovered exactly the way a third party's are: one entry point
# per module, whose only job is to import it so its classes self-register. There are no
# privileged built-ins — if this mechanism breaks, our loop stops resolving too, which is
# the point.
[project.entry-points."nemo.experimentalist.components"]
"strategy.evolutionary" = "nemo_experimentalist_plugin.experimentalist.components.loop"
"builder.coder" = "nemo_experimentalist_plugin.experimentalist.components.coder"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_experimentalist_plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
