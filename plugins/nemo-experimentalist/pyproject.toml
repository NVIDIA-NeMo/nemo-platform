[project]
name = "nemo-experimentalist-plugin"
version = "0.1.0"
description = "NeMo Experimentalist plugin for NeMo Platform."
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2",
    "httpx",
    "harbor>=0.16",
    # Backs the default evaluator_type: harbor_agent_task_runner. The plain `harbor`
    # dependency above stays: evaluator_type: harbor drives Harbor's Job directly.
    "nemo-evaluator-sdk",
    "opentelemetry-proto>=1.42.1",
    "protobuf>=6.0.0",
    "nooa",
    "pyyaml>=6.0.3",
    "nemo-insights-plugin",
    "nemo-platform",
    "nemo-platform-plugin",
    "tomlkit>=0.13.3",
]

[project.entry-points."nemo.cli"]
experimentalist = "nemo_experimentalist_plugin.cli:ExperimentalistCLI"

[project.entry-points."nemo.skills"]
experimentalist = "nemo_experimentalist_plugin.skills:skills_dir"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_experimentalist_plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
# Mirrors the subset of the repo-root pytest.ini markers this suite uses, so the
# plugin's tests carry the same meaning whichever rootdir pytest resolves.
markers = [
  "e2e: End-to-end tests - test complete customer workflows on deployed infrastructure",
  "slow: Tests that take a long time to run",
  "skip_in_ci: Tests that should be skipped in CI environment",
]
