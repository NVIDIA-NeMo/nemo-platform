id: nemo-experimentalist-gitlab-read
display_name: NeMo Experimentalist GitLab read
description: GitLab HTTPS clone/fetch and read-only API access
category: source_control
credentials:
  - name: api_token
    description: GitLab token
    env_vars: [GITLAB_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_token]
endpoints:
  - host: gitlab.com
    port: 443
    protocol: rest
    enforcement: enforce
    allow_encoded_slash: true
    rules:
      - allow:
          method: GET
          path: /**
      - allow:
          method: HEAD
          path: /**
      - allow:
          method: POST
          path: /**/git-upload-pack
binaries:
  - /usr/bin/git
  - /usr/bin/glab
