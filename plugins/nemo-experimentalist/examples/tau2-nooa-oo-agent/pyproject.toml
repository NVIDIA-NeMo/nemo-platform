[project]
name = "nemo-oo-agent"
version = "0.1.0"
description = "Basic NVIDIA-labs OO Agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mcp==1.25.0",
    "nooa[tracing]",
    "opentelemetry-exporter-otlp-proto-http",
    "orjson==3.11.9",
]
[tool.uv.sources]
# Pinned to a commit, not a tag: tags are mutable, so a moved `v0.0.6` would
# silently change what this example runs. Matches the repo-root pin.
nooa = { git = "https://github.com/NVIDIA-NeMo/labs-OO-Agents.git", rev = "bea4614a0e2a6cf88f76225466159af883da80a0" }
