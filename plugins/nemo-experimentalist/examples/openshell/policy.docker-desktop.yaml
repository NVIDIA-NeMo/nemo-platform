# Explicit local-development fallback for Docker Desktop kernels that do not
# expose Landlock. Process, seccomp, and network controls remain active, but
# filesystem access is not kernel-enforced when Landlock is unavailable.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /app
    - /bin
    - /dev/urandom
    - /etc
    - /lib
    - /opt
    - /proc
    - /usr
    - /var/log
  read_write:
    - /dev/null
    - /dev/shm
    - /home/sandbox
    - /sandbox
    - /tmp

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  nemo_platform:
    name: nemo-platform
    endpoints:
      - host: host.docker.internal
        port: 8080
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /health/ready
    binaries:
      - path: /app/.venv/bin/python
      - path: /app/.venv/bin/python3.13
      - path: /usr/local/bin/python3.13
  harbor_bridge:
    name: harbor-bridge
    endpoints:
      - host: host.docker.internal
        port: 8765
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /health/ready
          - allow:
              method: POST
              path: /v1/evaluations
    binaries:
      - path: /app/.venv/bin/python
      - path: /app/.venv/bin/python3.13
      - path: /usr/local/bin/python3.13
