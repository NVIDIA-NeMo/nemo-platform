# Smoke fixture profile. Everything is local: a "./" prefix classifies as a local
# path, so no registry_url is needed and nothing is downloaded.
#
#   nemo agents experimentalist doctor --profile <this file>
#   nemo agents experimentalist run --profile <this file> --no-insight

# Logical agent name. In insight mode it must match the Insight's agent; under
# --no-insight it is only a label.
agent: smoke-agent

# Where the baseline agent's code lives, relative to this file. The whole
# directory is copied into every candidate workspace and is readable by the
# Coder, so it holds the agent and nothing else: no README, no configs, no
# scripts, no dataset, no .env. Anything that should not reach the Coder simply
# stays out of this folder rather than relying on an exclusion list.
agent_source: ./agent

# Behaviour contract threaded to the analyzer and goal-tree components. It states
# the rules the agent must keep, chiefly that it stays offline and reproducible.
ethos: ./ETHOS.md

# Required by the profile schema even under --no-insight, where it is never read.
# It points at a single Harbor task directory used as the shape for Eval Author
# generated tasks in insight mode.
task_template: ./dataset/task-template

datasets:
  train: ./dataset/groups/g1-aggregation/train
  validation: ./dataset/groups/g1-aggregation/validation

workspace: default
