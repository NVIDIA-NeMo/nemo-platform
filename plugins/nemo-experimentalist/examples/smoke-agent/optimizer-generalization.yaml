#
# The generalization scenario's profile. Identical to optimizer.yaml except for
# the datasets, which is the whole point: what separates a repair scenario from a
# generalization one is the split, not any tuning knob.
#
#   nemo agents experimentalist run --profile optimizer-generalization.yaml \
#     --no-insight --config configs/short.yaml
#
# g4-dispatch-order's train split shows only plain department counts, so the
# reachable fix -- reordering the handler chain -- passes train. Validation asks
# for role-scoped counts, which that fix does not reach. A healthy run therefore
# *keeps the baseline*, the opposite of what the repair scenario asserts.
#
# This profile exists because a config alone could not express that. Both
# scenarios use configs/short.yaml; optimizer.yaml pins the repair datasets to
# g1-aggregation, while this profile selects the generalization split.

# Logical agent name. In insight mode it must match the Insight's agent; under
# --no-insight it is only a label.
agent: smoke-agent

# Same agent under test as the repair scenario. Only the tasks differ.
agent_source: ./agent

agent_spec: ./AGENT-SPEC.md

# Required by the profile schema even under --no-insight, where it is never read.
task_template: ./dataset/task-template

datasets:
  train: ./dataset/groups/g4-dispatch-order/train
  validation: ./dataset/groups/g4-dispatch-order/validation

workspace: default
