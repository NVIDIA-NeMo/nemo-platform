schema_version = "1.1"

artifacts = [{ source = "/app/artifacts", destination = "output" }]

[task]
name = "smoke/g2-lookup-zoe"
authors = [{ name = "NVIDIA" }]
keywords = ["smoke", "g2"]

[metadata]
difficulty = "easy"
category = "smoke"

[agent]
timeout_sec = 120.0

[verifier]
timeout_sec = 60.0

[environment]
# Set by scripts/build_image.py; a test asserts it matches the current content
# hash of the Dockerfile and records file. environment/ stays empty: Harbor
# requires the directory, and a Dockerfile would shadow the prebuilt image.
docker_image = "smoke-agent-env:sha-bc1849bfdcf5"
cpus = 1
memory_mb = 1024
