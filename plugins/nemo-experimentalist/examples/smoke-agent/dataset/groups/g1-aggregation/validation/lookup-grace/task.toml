schema_version = "1.1"

artifacts = [{ source = "/app/artifacts", destination = "output" }]

[task]
name = "smoke/g1-lookup-grace"
authors = [{ name = "NVIDIA" }]
keywords = ["smoke", "g1"]

[metadata]
difficulty = "easy"
category = "smoke"

[agent]
timeout_sec = 120.0

[verifier]
timeout_sec = 60.0

[environment]
# Set by scripts/build_image.py; a test asserts it matches the current content
# hash of the Dockerfile and records file. Tasks ship no environment/ directory.
docker_image = "smoke-agent-env:sha-bc1849bfdcf5"
cpus = 1
memory_mb = 1024
