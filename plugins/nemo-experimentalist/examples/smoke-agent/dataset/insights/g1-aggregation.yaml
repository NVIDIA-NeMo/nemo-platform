insights:
- id: insights-insight-Ax2i7YNQTeDLen9JC9i2cn
  workspace: smoke-agent
  name: insights-insight-59jp3
  title: Total-hours questions fall through to the fallback answer
  agent: smoke-agent
  description: When the prompt asks for the total hours for a selected group (for
    example, by role or department), smoke-agent's ordered handler dispatch runs handle_lookup,
    handle_list, and handle_count, but none of them match the aggregate-total form.
    The top-level solve span then returns the fixed fallback string 'I do not know
    how to answer that.' instead of writing the required single-line `total=<result>`
    answer. This diverges from the contract that sums over records must be reported
    with the canonical `total=` key, and suggests the deterministic regex handler
    set is missing a total/sum-hours handler for grouped selections.
