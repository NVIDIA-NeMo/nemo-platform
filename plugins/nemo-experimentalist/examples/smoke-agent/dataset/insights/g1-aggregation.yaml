insights:
- id: insight-632f7e00e110446db5b616ba25b4a50e
  workspace: smoke-agent
  title: Agent has no handler for 'total hours' sum-aggregation queries and returns
    the 'I do not know' fallback
  agent: smoke-agent
  description: 'In the `g1-aggregation` evaluation, instructions of the form ''What
    is the total hours for the <department> department?'' (expecting a `total=<result>`
    line) are not answered. `solve` dispatches through its handler chain — `handle_lookup`,
    `handle_list`, `handle_count` — none of which recognizes a request to SUM a numeric
    field (hours) across the records for a department, so each returns None and `solve`
    falls back to the literal string ''I do not know how to answer that.'' This is
    written to `/app/artifacts/output.txt` instead of the required `total=<n>` line,
    failing the test case. Affected component: `agent.py` `solve`/handler dispatch
    — there is a `handle_count` (record counting) but no `handle_sum`/total handler,
    so any aggregation that requires summing a field is unsupported. Contrast with
    single-record lookups (e.g. ''department of Ada Lovelace''), which succeed. Hypothesis:
    the routing regexes and handlers cover lookup/list/count but omit sum/total aggregation,
    so all ''total <field>'' style questions fall through to the fallback. Observed
    in test cases total-hours-ops and total-hours-research.'
  status: open
  trace_refs:
  - bdb897d4701b43a5d2fabfe5320717dd
  - 9299f49567a3f79adc5a4e817e9e6a57
