#
# Two rounds, two candidates, whole train split. The per-group gate checks share
# this file, because the loop settings they want are identical. What separates
# them is the profile:
#
#   optimizer.yaml                  -> g1-aggregation, the winner must beat baseline
#   optimizer-generalization.yaml   -> g4-dispatch-order, the baseline must be kept
#
# There were once two files here, differing in `max_train_batch_tasks`: the
# generalization scenario sampled a single train task on the theory that seeing
# one example made an over-narrow fix likely. That theory was wrong. What decides
# the scenario is how the splits are built -- whether train shows enough for a
# general fix to be reachable -- and sampling only dropped tasks, once excluding
# the control. Setting it back to `null` left two identical files, and a README
# claiming they differed. Merged rather than left as a trap.

# Two, not one. A single round scores whatever the Coder guessed first, and a
# near-miss is indistinguishable from no attempt: a g3 run produced a candidate
# that split the instruction and kept both ends, which is the right idea reached
# the wrong way, and the round ended there. A second round breeds from that
# survivor with the first round's analysis in hand, so a partial fix gets a chance
# to be finished rather than being recorded as a failure.
#
# It also makes the gate less noisy. At two candidates a single round lands the g1
# repair about 80% of the time, so a red result was as likely to be variance as a
# regression -- which is useless for a check whose whole job is to be believed.
max_rounds: 2

# Default, and inert while the convergence check is off below. It is not inert if
# that is ever turned back on: at 1, `cutoff_round` is the latest round, so `old`
# holds every scored node, the two Pareto fronts are the same set, and the check
# returns converged after round 1 whatever the scores. That would make
# `max_rounds: 2` dead config. Anyone enabling the check here must raise this to 2
# in the same edit.
min_rounds_before_stopping: 1

max_survivors: 1

# Two candidates so ranking and survivor selection do real work. With one,
# nothing is compared against anything and the two metric keys buy nothing.
max_candidates: 2

# Whole train split, for both scenarios. The Coder must see every kind of case
# the split carries, and the control must be present so a destructive fix costs
# reward. A number here silently drops tasks -- 2 excluded the control in a real
# run, leaving the round with nothing failing to analyze.
max_train_batch_tasks: null

# Both metrics have a known ceiling in this deterministic fixture. Stop before
# another round once one eligible candidate passes every task without changing
# the required output shape.
objective_function:
  - name: reward
    direction: maximize
    target: 1.0
  - name: shape_ok
    direction: maximize
    target: 1.0

trajectory_scorer: null

# Off, and it should stay off at this depth. The terminator only tests for
# *stagnation* -- whether any new candidate reached the Pareto front, then an LLM
# judgement on whether the round analysis reads as a plateau. It has no notion of
# the objective being satisfied, so a round that goes 0.333 -> 1.000 does not stop
# early; it costs an extra model call and runs round 2 anyway.
#
# "Qualitatively plateaued" reads like it might cover a maxed-out score, but the
# terminator skill it is judged against lists only stagnation signals -- a repeated
# root cause, survivors converging on the same mutation, diagnostics thinning -- and
# names "describes ongoing improvement" as a reason to *continue*. A run that has
# just solved everything does stop eventually, one round later, when nothing new
# reaches the front: as stagnation, not as success.
#
# The case it would stop on is the opposite one: a round-1 candidate that ties the
# baseline reads as a plateau, and that is precisely the near-miss round 2 exists
# to finish. Enabling it here would cut the runs that need the second round and
# leave the ones that do not.
#
# `full.yaml` is where the terminator earns its place: five rounds, three
# candidates, and stopping when the front genuinely stops moving.
terminator: null

outcome_evaluator_config:
  n_attempts: 1
  n_concurrent_trials: 3
  quiet: true

# Insight mode materializes and deeply examines these representative failures
# before the optimization loop begins. Five matches the five distinct failure
# shapes recorded for every smoke-agent group.
eval_author:
  max_traces: 5
