#
# Full scenario: several groups at once, multiple rounds, terminator decides when
# to stop. Point it at dataset/groups/_all.
#
# Two groups are held out of it -- one whose pass condition is the opposite of
# this one's, and one that is only reachable with trajectory scoring on, which it
# is not here. build_all_group.py has the evidence and the conditions for putting
# the second one back. Every task the combined set does contain is meant to be
# reachable, so a run that leaves one failing is a finding rather than an
# expected shortfall.
#
# This is the only scenario that exercises the evolutionary machinery -- survivors
# carried between rounds, ranking over more than two candidates, and the
# convergence check. The single-round configs leave all of it inert.
#
# EXPECT HOURS, NOT MINUTES. Roughly 25 min per round at three candidates: a bit
# over an hour if the terminator stops at three rounds, around two if it reaches
# the ceiling. That cost buys
# something tau-style benchmarks cannot: the expected outcome is known up front,
# so the result is checkable rather than merely plausible.

# A ceiling, not a target. The terminator is expected to stop first; reaching the
# ceiling is itself a finding.
max_rounds: 5

# Default. The convergence check may not stop the run before this many rounds.
min_rounds_before_stopping: 3

max_survivors: 3

# Three per round. Enough for the Proposer to try genuinely different edits in a
# round -- past runs landed three separate improvements in one -- without paying for
# candidates that mostly duplicate each other. The Proposer may return fewer, and
# often does in later rounds; only an empty proposal is fatal.
max_candidates: 3

# Whole split. Six failing tasks and three that already pass, so there is a
# gradient to climb and a cost to breaking something that worked.
max_train_batch_tasks: null

# Trajectory scoring is OFF, and that also switches off the goal tree it feeds.
#
# Not because it cannot work here. This comment used to say the scorer was
# defeated by the agent's determinism -- candidates indistinguishable, nothing to
# order by -- and that was wrong. The traces separate them plainly: the call
# graph names every method that ran and its status, so a candidate whose lookup
# errors is obvious beside one whose lookup returns a value. In a verification
# run the scorer ranked two candidates that were tied at 1.000 on reward, citing
# exactly that.
#
# What actually failed was the citation rule. Every score had to be grounded in
# span IDs, and the only sanctioned lookups are indexed by turn -- which an agent
# that makes no LLM calls never produces. The scorer could not satisfy its own
# contract, retried to the CodeAct ceiling, and raised GenerationError, which
# ended the run. Fixed in trace_scorer.py.
#
# It stays off because it is not yet dependable, and both failure modes are
# silent: a goal tree rejected on node count disables it for an entire run
# without saying so, and in the run that verified the fix it scored three
# candidates and returned nothing for the fourth, which then won.
#
# Consequence: trajectory scoring and the goal tree are NOT covered by this
# scenario. Multiple rounds, survivors, ranking, and the convergence check are.
# Turning it on is worthwhile once it is dependable -- build_all_group.py holds
# g5 out of the combined set for the same reason.
disable_trajectory_scoring: true

# The one that matters here: the terminator deciding when to stop is the point.
disable_convergence_check: false

evaluator:
  n_attempts: 1
  n_concurrent_trials: 5
  quiet: true
