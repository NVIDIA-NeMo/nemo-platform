#
# One round, two candidates, whole train split. Both single-round scenarios use
# this file -- the repair gate and the generalization gate -- because the loop
# settings they want are identical. What separates them is the profile:
#
#   optimizer.yaml                  -> g1-aggregation, the winner must beat baseline
#   optimizer-generalization.yaml   -> g4-dispatch-order, the baseline must be kept
#
# There were once two files here, differing in `max_train_batch_tasks`: the
# generalization scenario sampled a single train task on the theory that seeing
# one example made an over-narrow fix likely. That theory was wrong. What decides
# the scenario is how the splits are built -- whether train shows enough for a
# general fix to be reachable -- and sampling only dropped tasks, once excluding
# the control. Setting it back to `null` left two identical files, and a README
# claiming they differed. Merged rather than left as a trap.

max_rounds: 1
min_rounds_before_stopping: 1
max_survivors: 1

# Two candidates so ranking and survivor selection do real work. With one,
# nothing is compared against anything and the two metric keys buy nothing.
max_candidates: 2

# Whole train split, for both scenarios. The Coder must see every kind of case
# the split carries, and the control must be present so a destructive fix costs
# reward. A number here silently drops tasks -- 2 excluded the control in a real
# run, leaving the round with nothing failing to analyze.
max_train_batch_tasks: null

disable_trajectory_scoring: true
disable_convergence_check: true

evaluator:
  n_attempts: 1
  n_concurrent_trials: 3
  quiet: true
