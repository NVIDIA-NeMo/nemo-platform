# Benchmark NMP IGW VirtualModel with nemo-guardrails request/response middleware.

batch_name: nmp_igw_guardrails_sweep_concurrency
output_base_dir: plugins/nemo-guardrails/benchmarks/artifacts/aiperf_results

base_config:
  model: benchmark/guardrails-vm
  # AIPerf only needs the tokenizer to count input/output tokens for its
  # metrics; the actual model under test is the IGW VirtualModel above. We
  # use Qwen3-8B (Apache-2.0, ungated) instead of Llama 3.3 so CI can fetch
  # the tokenizer without an HF_TOKEN. Token counts will differ slightly
  # from Llama, but middleware-overhead and latency trends remain valid as
  # long as the tokenizer stays consistent across runs.
  tokenizer: Qwen/Qwen3-8B
  # AIPerf's pre-check does GET urljoin(url, "/v1/models"); we run a thin
  # shim on :8090 that satisfies that probe and reverse-proxies
  # /v1/chat/completions through to NMP's IGW. See
  # nemo_guardrails_plugin.benchmarks.shim for the implementation.
  url: "http://localhost:8090"
  endpoint: "/v1/chat/completions"
  endpoint_type: chat
  streaming: false

  warmup_request_count: 10
  benchmark_duration: 60
  concurrency: 0
  request_rate_mode: constant

  random_seed: 12345
  prompt_input_tokens_mean: 100
  prompt_input_tokens_stddev: 10
  prompt_output_tokens_mean: 50
  prompt_output_tokens_stddev: 5

sweeps:
  concurrency: [1, 2, 4, 8, 16, 32, 64]
