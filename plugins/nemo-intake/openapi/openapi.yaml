  /apis/intake/v2/workspaces/{workspace}/experiment-groups:
    post:
      tags:
      - Experiment Groups
      summary: Create Experiment Group
      operationId: create_experiment_group_apis_intake_v2_workspaces__workspace__experiment_groups_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentGroupRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentGroupResponse'
        '409':
          description: Experiment group already exists
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Experiment Groups
      summary: List Experiment Groups
      operationId: list_experiment_groups_apis_intake_v2_workspaces__workspace__experiment_groups_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number.
          default: 1
          title: Page
        description: Page number.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Page size.
          default: 100
          title: Page Size
        description: Page size.
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - -created_at
          - created_at
          - -updated_at
          - updated_at
          - -name
          - name
          type: string
          description: Sort field; prefix with '-' for descending.
          default: -created_at
          title: Sort
        description: Sort field; prefix with '-' for descending.
      - in: query
        name: filter
        style: deepObject
        required: false
        explode: true
        schema:
          $ref: '#/components/schemas/ExperimentGroupFilter'
        description: Filter experiment groups by name.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentGroupResponsesPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
