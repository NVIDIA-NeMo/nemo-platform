                $ref: '#/components/schemas/HTTPValidationError'
  /apis/intake/v2/workspaces/{workspace}/experiments/{name}/pin:
    post:
      tags:
      - Experiments
      summary: Pin Experiment
      description: 'Pin an experiment to the top of the list (workspace-shared).


        Re-pinning an already-pinned experiment refreshes ``pinned_at`` to the current
        timestamp,

        which is intentional (most-recently-pinned sorts first).'
      operationId: pin_experiment_apis_intake_v2_workspaces__workspace__experiments__name__pin_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResponse'
        '404':
          description: Experiment not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Experiments
      summary: Unpin Experiment
      description: 'Unpin an experiment. Idempotent: unpinning an already-unpinned
        experiment is a no-op.'
      operationId: unpin_experiment_apis_intake_v2_workspaces__workspace__experiments__name__pin_delete
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResponse'
        '404':
          description: Experiment not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/intake/v2/workspaces/{workspace}/experiments/{name}/sessions:
    get:
      tags:
      - Experiments
      summary: List Experiment Sessions
      operationId: list_experiment_sessions_apis_intake_v2_workspaces__workspace__experiments__name__sessions_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number.
          default: 1
          title: Page
        description: Page number.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Page size.
          default: 100
          title: Page Size
        description: Page size.
      - name: mode
        in: query
        required: false
        schema:
          enum:
          - summary
          - detailed
          type: string
          description: Response payload mode. summary keeps the same session row fields
            but truncates root-span input to 1000 characters; detailed returns the
            full root-span input.
          default: detailed
          title: Mode
        description: Response payload mode. summary keeps the same session row fields
          but truncates root-span input to 1000 characters; detailed returns the full
          root-span input.
      - in: query
        name: filter
        style: deepObject
        required: false
        explode: true
        schema:
          $ref: '#/components/schemas/ExperimentSessionFilter'
        description: Filter sessions by test_case_id and status.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentSessionResponsesPage'
        '404':
          description: Experiment not found
        '503':
          description: ClickHouse unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
