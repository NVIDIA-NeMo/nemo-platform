          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '204':
          description: Successful Response
        '404':
          description: Experiment group not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/intake/v2/workspaces/{workspace}/experiments:
    post:
      tags:
      - Experiments
      summary: Create Experiment
      operationId: create_experiment_apis_intake_v2_workspaces__workspace__experiments_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResponse'
        '409':
          description: Experiment already exists
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Experiments
      summary: List Experiments
      operationId: list_experiments_apis_intake_v2_workspaces__workspace__experiments_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number.
          default: 1
          title: Page
        description: Page number.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Page size.
          default: 100
          title: Page Size
        description: Page size.
      - name: sort
        in: query
        required: false
        schema:
          description: 'Field to sort by; prefix with ''-'' for descending. Sort by
            an experiment attribute (name, created_at, updated_at, pinned_at) or by
            an aggregate metric: run_count, cost_usd.<stat>, latency_ms.<stat>, or
            evaluators.<name>.<stat>, where <stat> is one of mean, median, p90, p95,
            p99, sum, count. When omitted, defaults to -created_at with pinned experiments
            first.'
          title: Sort
          type: string
        description: 'Field to sort by; prefix with ''-'' for descending. Sort by
          an experiment attribute (name, created_at, updated_at, pinned_at) or by
          an aggregate metric: run_count, cost_usd.<stat>, latency_ms.<stat>, or evaluators.<name>.<stat>,
          where <stat> is one of mean, median, p90, p95, p99, sum, count. When omitted,
          defaults to -created_at with pinned experiments first.'
      - in: query
        name: filter
        style: deepObject
        required: false
        explode: true
        schema:
          $ref: '#/components/schemas/ExperimentFilter'
        description: 'Filter experiments by name, experiment_group_id, dataset_name,
          dataset_version, created_by, created_at, or updated_at. Pass is_deleted=true
          to return only soft-deleted experiments; omit to see only live ones. Pass
          is_pinned=true (or false) to filter by pinned state; omit to return both.
          Filter by a rollup metric with numeric range operators ($gte/$lte/$gt/$lt/$eq):
          filter[run_count][$gte]=5, filter[cost_usd.mean][$lte]=0.5, filter[latency_ms.p95][$lte]=1000,
          or filter[evaluators.<name>.mean][$gte]=0.8.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResponsesPage'
        '400':
          description: Unsupported sort or filter field
        '413':
          description: Too many experiments selected to sort in one request
        '503':
          description: Telemetry store unavailable for a metric-based sort or filter
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
