[project]
name = "nemo-intake-plugin"
description = "Intake service for NeMo Platform - ingesting and reading spans, traces, annotations, and evaluator results"
readme = "README.md"
requires-python = ">=3.11,<3.15"

classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "nemo-intake-client",
    "nemo-platform-plugin",
    "fastapi>=0.115.5, <1.0.0",
    "uvicorn>=0.22.0, <1.0.0",
    "pydantic>=2.9.2, <3.0.0",
    "pydantic-settings>=2.6.1, <3.0.0",
    "clickhouse-connect>=0.7,<1.0",
    "opentelemetry-proto>=1.27.0",
]
version = "0.0.0"

[project.entry-points."nemo.services"]
intake = "nemo_intake_plugin.service:IntakeService"

[project.entry-points."nemo.sdk"]
intake = "nemo_intake_plugin.sdk:intake_sdk_resources"

[project.optional-dependencies]
test = [
    "nmp-testing",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0, <2.0.0",
    "pytest-env>=1.1.5, <2.0.0",
    "flake8>=6.1.0, <7.0.0",
    "isort>=5.12.0, <6.0.0",
    "mypy>=1.13.0, <2.0.0",
    "pre-commit>=3.7.1, <4.0.0",
    "setuptools>=78.1.1",
    "testcontainers[clickhouse]>=4.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_intake_plugin"]


[tool.uv.sources]
nemo-intake-client = { workspace = true }
nemo-platform-plugin = { workspace = true }
nmp-testing = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.nemo.openapi]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
