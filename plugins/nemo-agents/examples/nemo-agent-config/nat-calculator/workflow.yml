function_groups:
  calculator:
    _type: calculator

functions:
  current_datetime:
    _type: current_datetime

llms:
  llm:
    _type: nim
    model_name: nvidia/nemotron-3-nano-30b-a3b
    temperature: 0.0
    max_tokens: 1024
    chat_template_kwargs:
      enable_thinking: false

workflow:
  _type: react_agent
  tool_names:
    - calculator
    - current_datetime
  llm_name: llm
  verbose: false
  parse_agent_response_max_retries: 3
  use_native_tool_calling: true
