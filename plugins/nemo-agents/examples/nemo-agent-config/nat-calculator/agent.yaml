config_format: nemo-agents-spec-v1
name: nat-simple-calculator
description: Invoke the NAT simple calculator workflow through NeMo Fabric.

default_harness: nat

harnesses:
  nat:
    kind: nat
    settings:
      workflow: react
      tools:
        - calculator
        - current_datetime

models:
  default:
    provider: nvidia
    model: nvidia/nemotron-3-nano-30b-a3b
    api_key_env: NVIDIA_API_KEY
    temperature: 0.0
    settings:
      max_tokens: 1024
      chat_template_kwargs:
        enable_thinking: false

tools:
  blocked:
    - calculator__divide

environment:
  workspace: ./workspace
  artifacts: ./artifacts

telemetry:
  enabled: false
