[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemo-agent-config-example-email-security-triage"
version = "0.1.0"
description = "An IOC-extraction tool server for the nemo-agents-spec-v1 email-phishing example."
requires-python = ">=3.11,<3.15"
dependencies = [
    "mcp>=1.28.1,<2",
]

[project.scripts]
email-security-triage-iocs = "mcps.iocs:main"

[tool.hatch.build.targets.wheel]
packages = ["mcps"]
