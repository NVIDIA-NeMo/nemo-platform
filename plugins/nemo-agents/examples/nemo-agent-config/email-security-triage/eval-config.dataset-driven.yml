# eval-config.dataset-driven.yml
#
# Dataset-driven eval for the email-security-triage agent: one metric set scores
# every row of dataset.jsonl. See eval-config.dataset-driven.README.md.
#
# Authored in YAML; the sibling eval-config.task-driven.json is JSON. Both formats
# are accepted everywhere a config is read -- Studio's Run Evaluation upload and the
# CLI's --spec-file both sniff the content rather than the extension -- so pick
# whichever reads better for the config you are writing. YAML suits this one: its
# prompt_template and judge prompt are multi-line prose.
#
# `dataset` is a placeholder; `target` and `params` are per-run and absent by
# design. Studio injects all three at submit time; a CLI run supplies them (README
# Step 5).
dataset: <workspace>/<fileset>#dataset.jsonl
prompt_template: |-
  {{ item.user_message }}
  {% for e in item.emails %}
  --- Message {{ loop.index }} ---
  Subject: {{ e.subject }}
  From: {{ e.from }}

  {{ e.body }}
  {% endfor %}
metrics:
- bundle_kind: metric-bundle
  bundle_format_version: v1
  metric_type: llm-judge
  metadata:
    description: Verdict accuracy against the row's expected answer, for whichever capability the
      row asks for.
    labels: {}
  outputs:
  - name: accuracy
    description: null
    value_json_schema:
      description: Continuous numeric metric value.
      title: ContinuousScore
      type: number
  secrets: {}
  payload:
    kind: inline
    metric:
      type: llm-judge
      model: default/nvidia-nemotron-3-super-120b-a12b
      prompt_template:
        messages:
        - role: user
          content: |-
            You are scoring an email security analyst. The analyst was asked:
            "{{ item.user_message }}"
            over {{ item.emails | length }} message(s).

            Expected verdicts, in message order: "{{ item.expected_answer }}".

            Agent response:
            {{ sample.output_text }}

            Scoring rules:
            - When the analyst asked a question, the answer is the FIRST LINE and is a single word, phishing or benign. Ignore everything after it, even if it names the other verdict.
            - When the analyst asked nothing, the response is a report opening with ANALYSIS and carrying one block per message in order, each with a VERDICT: line. Read those VERDICT lines in order and ignore every other field.
            - Compare the verdicts you read against the expected verdicts, in order.

            Respond with a JSON object {"accuracy": <value>} where accuracy is the fraction of expected verdicts the response got right: 1 if all match, 0 if none, and the proportion in between.
      scores:
      - name: accuracy
        minimum: 0.0
        maximum: 1.0
      inference:
        max_tokens: 1024
        extra_body:
          nvext:
            max_thinking_tokens: 256
      reasoning:
        end_token: </think>
- bundle_kind: metric-bundle
  bundle_format_version: v1
  metric_type: string-check
  metadata:
    description: 'Routing: the first line''s shape must match the capability named in expected_tool.'
    labels: {}
  outputs:
  - name: string-check
    description: null
    value_json_schema:
      description: Continuous numeric metric value.
      title: ContinuousScore
      type: number
  secrets: {}
  payload:
    kind: inline
    metric:
      type: string-check
      operation: equals
      left_template: '{{ ''triage_message'' if ((sample.output_text or '''').split(''\n'')[0] | trim
        | lower) in [''phishing'', ''benign''] else ''review_messages'' if ((sample.output_text or
        '''').split(''\n'')[0] | trim | lower) == ''analysis'' else ''draft_warning'' }}'
      right_template: '{{ item.expected_tool }}'
