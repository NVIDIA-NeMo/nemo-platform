# Spec for `nemo agents eval-triage`.
#
# Intra-judge stability check: compares the locked Sonnet 4.6 laptop
# baseline against a fresh Sonnet 4.6 run on omnistation over the same
# corpus. Same judge, same corpus, different machines. The result
# establishes the noise floor any tuned-model candidate has to beat.
#
# Prerequisite: both artifacts must be in their respective filesets.
# - 'memory-triage-laptop-baseline' fileset on omnistation contains the
#    committed laptop baseline (upload once from your laptop):
#
#      nemo --context omnistation files upload \
#          --fileset memory-triage-laptop-baseline \
#          plugins/nemo-agents/src/nemo_agents_plugin/improvement/memory/phase1-smoke/baselines/baseline-sonnet-4-6-user.json
#
# - 'memory-triage-artifacts' fileset already contains the omnistation
#    triage-memory run output (produced by the triage-memory job).
#
# Run on omnistation:
#
#   nemo agents eval-triage run \
#       --spec-file plugins/nemo-agents/examples/memory-triage/sonnet-vs-self-omnistation.eval-triage.yml

baseline: memory-triage-laptop-baseline
candidate: memory-triage-artifacts
workspace: default

# The agreement report lands in its own fileset so it doesn't mix with
# the triage artifacts. Auto-creates on first run.
output: memory-triage-eval-reports

basename: sonnet-vs-self-omnistation
