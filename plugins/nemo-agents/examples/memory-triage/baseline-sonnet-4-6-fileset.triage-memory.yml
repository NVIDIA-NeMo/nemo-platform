# Spec for `nemo agents triage-memory` using NeMo Platform filesets on
# BOTH input (corpus) and output (artifacts).
#
# This is the recommended shape for omnistation / cluster / container
# runs where you don't want the artifacts living in some host-local
# directory you then have to scp back. Typical workflow:
#
#   # 1. From the laptop: upload the corpus once.
#   #    Args are positional: LOCAL_PATH [FILESET]. The fileset is
#   #    auto-created if it doesn't already exist.
#   nemo files upload \
#       ~/.pi/agent/claude-session-replays/CONSOLIDATED/USER.md \
#       user-memory-corpus
#
#   # 2. Run the job (anywhere). The corpus fileset is downloaded, the
#   #    job runs, and the artifacts are uploaded to the output fileset.
#   nemo agents triage-memory run \
#       --spec-file plugins/nemo-agents/examples/memory-triage/baseline-sonnet-4-6-fileset.triage-memory.yml
#
#   # 3. From the laptop again: pull the artifacts when ready.
#   nemo files download --fileset memory-triage-artifacts --local-path ./artifacts

# Input: fileset reference (workspace resolved via 'workspace' field below).
corpus: user-memory-corpus
workspace: default

# Output: also a fileset reference. The job auto-creates this fileset on
# success if it doesn't already exist, then uploads both artifacts:
#   memory-triage-artifacts/baseline-sonnet-4-6-user.json
#   memory-triage-artifacts/baseline-sonnet-4-6-user.md
# A failed run skips the upload entirely so the fileset never holds a
# half-finished pair.
output: memory-triage-artifacts

store_name: pi-hermes:CONSOLIDATED:user

judges:
  - azure-anthropic-claude-sonnet-4-6

basename: baseline-sonnet-4-6-user
