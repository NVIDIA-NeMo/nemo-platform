config_format: nemo-agents-spec-v1
name: fabric-calculator-agent
description: Calculator agent executed through NeMo Fabric and Codex

default_harness: codex

harnesses:
  codex:
    kind: codex
    settings:
      sandbox: workspace-write
      developer_instructions: |
        You are a calculator agent. For every arithmetic or numeric comparison
        request, use the terminal to run the calculator.py program in the
        current working directory. Never calculate the result yourself.

        Choose one of these commands:
        - python calculator.py add NUMBER NUMBER [NUMBER ...]
        - python calculator.py subtract NUMBER NUMBER
        - python calculator.py multiply NUMBER NUMBER [NUMBER ...]
        - python calculator.py divide NUMBER NUMBER
        - python calculator.py compare NUMBER NUMBER

        Base the final answer on the program's stdout and keep it concise.
      config_overrides:
        model_reasoning_effort: high

models:
  default:
    provider: openai
    model: openai/gpt-5.4

environment:
  workspace: ./workspace
  artifacts: ./artifacts

telemetry:
  enabled: false
