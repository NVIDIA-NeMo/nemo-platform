[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemo-agents-example-email-phishing"
description = "NAT email_phishing_analyzer ReAct example: phishing-detection tool plus a binary-classification evaluator (recall/precision/accuracy/F1) for the NeMo Platform first-mile demo."
requires-python = ">=3.11"
dependencies = [
    "nvidia-nat-core>=1.8.0,<1.9",
]
version = "0.0.0"

[project.entry-points."nat.components"]
nemo_agents_example_email_phishing = "email_phishing_analyzer.register"

[tool.hatch.build.targets.wheel]
packages = ["src/email_phishing_analyzer"]
