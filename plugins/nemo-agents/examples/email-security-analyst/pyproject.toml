[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemo-agents-example-email-security"
version = "0.1.0"
description = "NAT capability functions for the nemo-agents email-security-analyst example."
requires-python = ">=3.11,<3.15"
dependencies = [
    "nvidia-nat-core>=1.9.0a20260811,<1.10",
]

[project.entry-points."nat.components"]
nemo_agents_example_email_security = "nat_email_security_analyst.register"

[tool.hatch.build.targets.wheel]
packages = ["src/nat_email_security_analyst"]
