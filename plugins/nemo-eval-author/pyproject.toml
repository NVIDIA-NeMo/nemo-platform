[project]
name = "nemo-eval-author-plugin"
version = "0.1.0"
description = "Eval Author skills for Harbor suite discovery and source-neutral trace understanding."
requires-python = ">=3.12,<3.14"

[tool.uv]
# Nothing here installs as a package. The directory holds three skills, their
# path-loaded scripts, and contract tests. The skills stay at the top level
# because this plugin doesn't use the `nemo.skills` entry point.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
