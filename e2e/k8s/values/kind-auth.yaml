# kind values for auth-enabled CPU-only Kubernetes E2E runs.
#
# Extends kind.yaml with auth enabled (embedded PDP, unsigned JWTs allowed).

k8s-nim-operator:
  enabled: false

rbac:
  k8sNimOperatorEnabled: false
  volcanoEnabled: false

postgresql:
  image:
    repository: docker.io/library/postgres

core:
  storage:
    accessModes:
      - ReadWriteOnce
    volumePermissionsImage: docker.io/library/busybox

ingress:
  enabled: false

httpRoute:
  enabled: true
  parentRefs:
    - name: nmp-e2e-gateway

platformConfig:
  auth:
    enabled: true
    allow_unsigned_jwt: true
    policy_decision_point_provider: embedded
    policy_data_refresh_interval: 2
    bundle_cache_seconds: 2
    admin_email: "admin@example.com"
  inference_gateway:
    mock_provider_prefix: igw-mock-
  models:
    controller:
      backends:
        nim_operator:
          enabled: false
