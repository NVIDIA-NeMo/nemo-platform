# Minikube values for local development
# This is a standalone values file - use it in place of ./default.yaml
#
# Usage: helm upgrade -i nemo-platform k8s/helm -f e2e/k8s/values/minikube.yaml

postgresql:
  image:
    repository: docker.io/library/postgres
  persistence:
    storageClass: standard

core:
  storage:
    storageClass: standard
  volumePermissionsImage: docker.io/library/busybox:stable

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"

platformConfig:
  inference_gateway:
    mock_provider_prefix: igw-mock-
  jobs:
    executors:
      - provider: cpu
        profile: additional-volume
        backend: kubernetes_job
        config:
          service_account_name: '{{ include "nmp-core.jobsServiceAccountName" . }}'
          launcher_image: '{{ include "nmp-core.image" . }}'
          storage:
            pvc_name: '{{ include "nmp-core.persistentVolumeClaim" . }}'
            volume_permissions_image: '{{ .Values.core.storage.volumePermissionsImage }}'
            additional_volumes:
              - name: nmp-additional-volume
                persistent_volume_claim:
                  claim_name: '{{ include "nmp-core.persistentVolumeClaim" . }}'
            additional_volume_mounts:
              - name: nmp-additional-volume
                mount_path: /mnt/additional_storage
  safe_synthesizer:
    job_mode: container
