general:
  telemetry:
    logging:
      console:
        _type: console
        level: WARN
      file:
        _type: file
        path: ./email_phishing_analyzer.log
        level: DEBUG

functions:
  email_phishing_analyzer:
    _type: email_phishing_analyzer
    llm: nim_llm
    prompt: |
      Examine the following email content and determine if it exhibits signs of malicious intent. Look for any
        suspicious signals that may indicate phishing, such as requests for personal information or suspicious tone.

      Email content:
      {body}

      Return your findings as a JSON object with these fields:

      - is_likely_phishing: (boolean) true if phishing is suspected
      - explanation: (string) detailed explanation of your reasoning


llms:
  nim_llm:
    _type: nim
    model_name: nvidia-nemotron-3-nano-30b-a3b
    temperature: 0.0
    max_tokens: 512
  nim_rag_eval_llm:
    _type: nim
    model_name: nvidia-nemotron-3-super-120b-a12b
    temperature: 0.0
    max_tokens: 1024
  nim_trajectory_eval_llm:
    _type: nim
    model_name: nvidia-nemotron-3-super-120b-a12b
    temperature: 0.0
    max_tokens: 1024


workflow:
  _type: react_agent
  tool_names:
    - email_phishing_analyzer
  llm_name: nim_llm
  verbose: true
  parse_agent_response_max_retries: 3
  additional_instructions: The final response should indicate that the email is either "phishing" or "benign".

eval:
  general:
    output_dir: ./.tmp/eval/examples/evaluation_and_profiling/email_phishing_analyzer/original
    verbose: true
    dataset:
        _type: csv
        file_path: ./smaller_test.csv
        id_key: "subject"
        structure:
          question_key: body
          answer_key: label

  evaluators:
    accuracy:
      _type: tunable_rag_evaluator
      llm_name: nim_rag_eval_llm
      default_scoring: false
      judge_llm_prompt: >
        Compare only the phishing or benign classification in the generated
        answer with the expected answer. Set score to 1.0 when the labels
        match and 0.0 when they differ or the generated answer has no clear
        label. Return only the JSON object required by the format instructions,
        with numeric score and concise reasoning fields. Do not use Markdown.
    trajectory_accuracy:
      _type: trajectory
      llm_name: nim_trajectory_eval_llm
