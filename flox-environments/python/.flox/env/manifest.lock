    "install": {
      "uv": {
        "pkg-path": "uv",
        "pkg-group": "uv",
        "version": ">=0.9.14,<0.10.0"
      }
    },
    "vars": {
      "UV_CACHE_DIR": "${FLOX_ENV_CACHE}/uv-cache",
      "UV_MANAGED_PYTHON": "1",
      "UV_PYTHON": "3.13",
      "UV_PYTHON_INSTALL_DIR": "${FLOX_ENV_CACHE}/python",
      "UV_VENV_SEED": "1"
    },
    "hook": {
      "on-activate": "  set -euo pipefail\n\n  echo \"Python Setup... Starting\"\n  uv sync --frozen --all-packages\n  echo \"Python Setup... Complete\"\n"
    },
    "profile": {
      "bash": "  source .venv/bin/activate\n",
      "zsh": "  source .venv/bin/activate\n",
      "fish": "  set -gx VIRTUAL_ENV \"$PWD/.venv\"\n  set -gx PATH \"$VIRTUAL_ENV/bin\" $PATH\n"
    },
    "options": {}
  },
