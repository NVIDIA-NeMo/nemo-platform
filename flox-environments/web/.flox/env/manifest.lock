{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.11.0",
    "install": {
      "fnm": {
        "pkg-path": "fnm",
        "pkg-group": "node"
      }
    },
    "vars": {
      "FNM_DIR": "${FLOX_ENV_CACHE}/fnm",
      "FNM_VERSION_FILE_STRATEGY": "recursive",
      "NPM_CONFIG_STORE_DIR": "${FLOX_ENV_CACHE}/npm-cache"
    },
    "hook": {
      "on-activate": "  set -euo pipefail\n\n  echo \"NodeJS Setup... Starting\"\n  echo \"Current Directory: $(pwd)\"\n\n  eval \"$(fnm env --shell bash)\"\n  fnm install --use --corepack-enabled\n  corepack enable\n\n  package_manager=\"$(node -p \"require('./web/package.json').packageManager\")\"\n  corepack prepare \"${package_manager}\" --activate\n  CI=true pnpm install -C \"./web\" --frozen-lockfile\n\n  echo \"NodeJS Setup... Complete\"\n"
    },
    "profile": {
      "bash": "  eval \"$(fnm env --shell bash --use-on-cd --version-file-strategy=recursive)\"\n",
      "zsh": "  eval \"$(fnm env --shell zsh --use-on-cd --version-file-strategy=recursive)\"\n",
      "fish": "  fnm env --shell fish --use-on-cd --version-file-strategy=recursive | source\n"
    },
    "options": {}
  },
