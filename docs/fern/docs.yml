instances:
- url: nemo-platform.docs.buildwithfern.com/nemo-platform
  custom-domain: docs.nvidia.com/nemo-platform
  multi-source: true
title: NVIDIA NeMo Platform
global-theme: nvidia
logo:
  right-text: NeMo Platform
css:
- ./styles/notebook-viewer.css
- ./styles/button.css
navbar-links:
- type: github
  value: https://github.com/NVIDIA-NeMo/nemo-platform
experimental:
  mdx-components:
  - ./components
versions:
- display-name: Latest
  path: versions/latest.yml
  slug: latest

redirects:
  # Versioned targets for upstream NeMo Data Designer library docs.
  - source: "/data-designer-library/getting-started/welcome"
    destination: "https://docs.nvidia.com/nemo/datadesigner/v0.7.0/getting-started/welcome"
  - source: "/data-designer-library/tutorials/the-basics"
    destination: "https://docs.nvidia.com/nemo/datadesigner/v0.7.0/tutorials/the-basics"
  - source: "/data-designer-library/tutorials/seeding-with-an-external-dataset"
    destination: "https://docs.nvidia.com/nemo/datadesigner/v0.7.0/tutorials/seeding-with-an-external-dataset"
  - source: "/data-designer-library/concepts/columns"
    destination: "https://docs.nvidia.com/nemo/datadesigner/v0.7.0/concepts/columns"
  - source: "/data-designer-library/concepts/processors"
    destination: "https://docs.nvidia.com/nemo/datadesigner/v0.7.0/concepts/processors"
  - source: "/data-designer-library/concepts/validators"
    destination: "https://docs.nvidia.com/nemo/datadesigner/v0.7.0/concepts/validators"
  # Generated by utils/generate_redirects.py — re-run from repo root; see scripts README
  - source: "/index.html"
    destination: "/latest"
  - source: "/index"
    destination: "/latest"
  - source: "/latest/:path*/index.html"
    destination: "/latest/:path*"
  - source: "/:path*/index.html"
    destination: "/:path*"
  # Sphinx page URLs (foo.html); must follow all :path*/index.html rules above
  - source: "/:path*.html"
    destination: "/:path*"
