# Publishes the Fern documentation site from the default branch when docs
# change, a release tag is pushed, a docs republish tag is pushed, or the
# workflow is manually triggered.
#
# To publish a release version: push a stable SemVer release tag, for example
# `git tag 1.2.0 && git push origin 1.2.0`.
# To republish docs without creating a release version: push a docs tag, for
# example `git tag docs/v1.2.0 && git push origin docs/v1.2.0`.
# Or use the "Run workflow" button in the Actions tab.
#
# Required configuration:
# - Organization secret: DOCS_FERN_TOKEN (from `fern token` for the nvidia Fern org)

name: Publish Fern Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
    tags:
      - '*.*.*'
      - 'docs/v*'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install Fern dependencies
        working-directory: ./docs/fern
        run: npm ci

      - name: Check release tag eligibility
        id: release-tag
        if: ${{ github.ref_type == 'tag' && !startsWith(github.ref_name, 'docs/') }}
        working-directory: ./docs/fern
        run: |
          node scripts/materialize-release-versions.mjs --check-tag "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Fetch pre-release branches
        if: ${{ steps.release-tag.outputs.eligible != 'false' }}
        working-directory: ./docs/fern
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f release-branches.json ]; then
            exit 0
          fi
          # Checkout used persist-credentials: false, so authenticate this one
          # fetch the same way actions/checkout does internally, scoped to this
          # step only (no credentials left behind for later steps).
          auth_header="AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_TOKEN}" | base64 | tr -d '\n')"
          for branch in $(node -e "for (const b of Object.keys(require('./release-branches.json'))) console.log(b)"); do
            if git -c http.https://github.com/.extraheader="${auth_header}" \
              ls-remote --exit-code --heads origin "${branch}" >/dev/null; then
              git -c http.https://github.com/.extraheader="${auth_header}" \
                fetch origin "${branch}:refs/remotes/origin/${branch}"
            else
              status=$?
              if [ "${status}" -eq 2 ]; then
                echo "::warning::Pre-release branch ${branch} does not exist (release-branches.json)"
              else
                exit "${status}"
              fi
            fi
          done

      - name: Materialize release versions
        if: ${{ steps.release-tag.outputs.eligible != 'false' }}
        working-directory: ./docs/fern
        run: npm run materialize:versions

      - name: Check Fern docs
        if: ${{ steps.release-tag.outputs.eligible != 'false' }}
        run: make docs-check

      - name: Publish Docs
        if: ${{ steps.release-tag.outputs.eligible != 'false' }}
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        working-directory: ./docs/fern
        run: npm run generate
