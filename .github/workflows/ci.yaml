name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Path Changes
    runs-on: ubuntu-latest
    outputs:
      openapi: ${{ steps.changes.outputs.openapi }}
      test: ${{ steps.changes.outputs.test }}
      deps: ${{ steps.changes.outputs.deps }}
      e2e: ${{ steps.changes.outputs.e2e }}
      docs: ${{ steps.changes.outputs.docs }}
      web-studio: ${{ steps.changes.outputs.web-studio }}
      tools: ${{ steps.changes.outputs.tools }}
    steps:
      - uses: actions/checkout@v6
      - name: Record test start
        uses: ./.github/actions/test-status
        with:
          name: Detect Path Changes
          phase: start
      - uses: ./.github/actions/changes
        id: changes
      - name: Record test status
        if: always()
        uses: ./.github/actions/test-status
        with:
          name: Detect Path Changes
          phase: finish
          status: ${{ job.status }}

  actionlint:
    name: Run actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Record test start
        uses: ./.github/actions/test-status
        with:
          name: Run actionlint
          phase: start
      - name: Install actionlint
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/actionlint"
          curl -fsSL \
            -o "${RUNNER_TEMP}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${RUNNER_TEMP}/actionlint.tar.gz" \
            | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}/actionlint"
      - name: Lint GitHub workflows and actions
        shell: bash
        run: |
          "${RUNNER_TEMP}/actionlint/actionlint"
      - name: Record test status
        if: always()
        uses: ./.github/actions/test-status
        with:
          name: Run actionlint
          phase: finish
          status: ${{ job.status }}

  lint:
    name: Lint all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Record test start
        uses: ./.github/actions/test-status
        with:
          name: Lint all
          phase: start
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm via corepack
        run: npm i -g corepack@0.31.0 && corepack enable pnpm
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install scanner dependencies
        shell: bash
        run: script/install_osv_scanner.sh
      - name: Run lint
        run: tools/lint/lint-all.sh
        shell: bash
        env:
          CI_PROJECT_DIR: ${{ github.workspace }}
      - name: Upload lint artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lint-artifacts
          retention-days: 7
          path: |
            third_party/
            openapi/openapi.yaml
            openapi/ga/openapi.yaml
            openapicheck/openapi.yaml
            openapicheck/openapi.ga.yaml
            docs/set-up/config-reference.md
            python-sdk-lint/
            web/packages/sdk/generated/
            diff.txt
      - name: Record test status
        if: always()
        uses: ./.github/actions/test-status
        with:
          name: Lint all
          phase: finish
          status: ${{ job.status }}

  policy-wasm:
    name: Build OPA policy WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Record test start
        uses: ./.github/actions/test-status
        with:
          name: Build OPA policy WASM
          phase: start
      - uses: ./.github/actions/build-policy-wasm
      - name: Upload policy WASM
        uses: actions/upload-artifact@v6
        with:
          name: policy-wasm
          retention-days: 1
          path: services/core/auth/src/nmp/core/auth/assets/policy.wasm
      - name: Record test status
        if: always()
        uses: ./.github/actions/test-status
        with:
          name: Build OPA policy WASM
          phase: finish
          status: ${{ job.status }}

  python-unit-test-tools:
    name: Python unit tests (tools)
    needs: [changes]
    if: >
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.tools == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Record test start
        uses: ./.github/actions/test-status
        with:
          name: Python unit tests (tools)
          phase: start
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Run tools unit tests
        run: uv run pytest tools -v --junit-xml=report.xml
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-unit-test-tools-results
          retention-days: 30
          path: report.xml
      - name: Record test status
        if: always()
        uses: ./.github/actions/test-status
        with:
          name: Python unit tests (tools)
          phase: finish
          status: ${{ job.status }}

  python-unit-test:
    name: Python unit tests
    needs: [policy-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Record test start
        uses: ./.github/actions/test-status
        with:
          name: Python unit tests
          phase: start
      - name: Download policy WASM
        uses: actions/download-artifact@v8
        with:
          name: policy-wasm
          path: services/core/auth/src/nmp/core/auth/assets
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Run unit tests
        run: make test-unit-ci
        env:
          EXTRA: cpu
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTEST_WORKERS: "2"
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-unit-test-results
          retention-days: 30
          path: |
            report.xml
            coverage.xml
            coverage.json
            coverage-html/
      - name: Record test status
        if: always()
        uses: ./.github/actions/test-status
        with:
          name: Python unit tests
          phase: finish
          status: ${{ job.status }}

  python-integration-test:
    name: Python integration tests
    needs: [policy-wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Record test start
        uses: ./.github/actions/test-status
        with:
          name: Python integration tests
          phase: start
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Download policy WASM
        uses: actions/download-artifact@v8
        with:
          name: policy-wasm
          path: services/core/auth/src/nmp/core/auth/assets
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.AIRE_DOCKERHUB_USERNAME }}
          password: ${{ secrets.AIRE_DOCKERHUB_ACCESS_TOKEN }}
      - name: Pull mock base images
        run: |
          docker pull nginx:1.29.4-alpine-slim
          docker pull alpine:3.23
        shell: bash
      - name: Run integration tests
        run: make test-integration-ci
        env:
          EXTRA: cpu
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTEST_WORKERS: "2"
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-integration-test-results
          retention-days: 30
          path: |
            report.xml
            coverage.xml
            coverage.json
      - name: Record test status
        if: always()
        uses: ./.github/actions/test-status
        with:
          name: Python integration tests
          phase: finish
          status: ${{ job.status }}

  # Build wheels for all packages × python versions. Downstream jobs
  # (wheel-test, python-e2e-test) download these artifacts instead
  # of rebuilding.
  wheel-build:
    name: ${{ matrix.package }} wheel build (py${{ matrix.python-version }})
    needs: [policy-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [nemo-platform, nemo-platform-plugin]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Record test start
        uses: ./.github/actions/test-status
        with:
          name: ${{ matrix.package }} wheel build (py${{ matrix.python-version }})
          phase: start
      - name: Download policy WASM
        if: matrix.package == 'nemo-platform'
        uses: actions/download-artifact@v8
        with:
          name: policy-wasm
          path: services/core/auth/src/nmp/core/auth/assets
      - name: Build ${{ matrix.package }} wheel
        id: build
        uses: ./.github/actions/build-nemo-platform-wheel
        with:
          package: ${{ matrix.package }}
          out-dir: ${{ github.workspace }}/dist
          cadence: nightly
          # Sentinel epoch — the wheel version is meaningless for a CI test
          # build, but stamp_sdk_version.py requires \d{14}.
          nightly-timestamp: "19700101000000"
          python-version: ${{ matrix.python-version }}
      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}-wheel-py${{ matrix.python-version }}
          path: ${{ steps.build.outputs.wheel-path }}
          retention-days: 7
          if-no-files-found: error
      - name: Record test status
        if: always()
        uses: ./.github/actions/test-status
        with:
          name: ${{ matrix.package }} wheel build (py${{ matrix.python-version }})
          phase: finish
          status: ${{ job.status }}

  # Test each wheel: install from the artifact and run basic CLI /
  # import checks.
  wheel-test:
    name: ${{ matrix.package }} wheel build + test (py${{ matrix.python-version }})
    needs: [wheel-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [nemo-platform, nemo-platform-plugin]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Record test start
        uses: ./.github/actions/test-status
        with:
          name: ${{ matrix.package }} wheel build + test (py${{ matrix.python-version }})
          phase: start
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.package }}-wheel-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/wheelcheck

      - name: Install + test nemo-platform CLI
        if: matrix.package == 'nemo-platform'
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          NMP_DATA_DIR: ${{ runner.temp }}/nemo-data
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("${RUNNER_TEMP}"/wheelcheck/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          WHEEL="${wheels[0]}"
          uv tool install --force --python "${PYTHON_VERSION}" "${WHEEL}[services]"
          cd "${RUNNER_TEMP}/wheelcheck"
          unset PYTHONPATH VIRTUAL_ENV
          bash "${GITHUB_WORKSPACE}/script/test-nemo-cli.sh"

      - name: Install + test nemo-platform-plugin
        if: matrix.package == 'nemo-platform-plugin'
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=("${RUNNER_TEMP}"/wheelcheck/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          WHEEL="${wheels[0]}"
          cd "${RUNNER_TEMP}/wheelcheck"
          uv venv .venv --python "${PYTHON_VERSION}"
          uv pip install --python .venv/bin/python "${WHEEL}"
          unset PYTHONPATH VIRTUAL_ENV
          # Import the package + a couple of representative submodules
          # (cli, commands). These are the surfaces a plugin author would
          # touch first; if any of them fail to import, the wheel is
          # broken in a way that surfaces immediately on day one.
          .venv/bin/python -c "
          import nemo_platform_plugin
          import nemo_platform_plugin.cli
          import nemo_platform_plugin.commands
          print('nemo_platform_plugin', getattr(nemo_platform_plugin, '__version__', '<no __version__>'))
          "
      - name: Record test status
        if: always()
        uses: ./.github/actions/test-status
        with:
          name: ${{ matrix.package }} wheel build + test (py${{ matrix.python-version }})
          phase: finish
          status: ${{ job.status }}

  # E2E tests: start services from the workspace venv and run the e2e
  # suite against the real process.
  python-e2e-test:
    name: Python e2e tests
    needs: [policy-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Record test start
        uses: ./.github/actions/test-status
        with:
          name: Python e2e tests
          phase: start
      - name: Download policy WASM
        uses: actions/download-artifact@v8
        with:
          name: policy-wasm
          path: services/core/auth/src/nmp/core/auth/assets
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Run e2e tests
        run: make test-e2e
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          E2E_SERVICES_LOG_DIR: ${{ runner.temp }}/e2e-services-logs
          NGC_API_KEY: ${{ secrets.NGC_REGISTRY_READ_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Dump server logs
        if: always()
        run: |
          echo "::group::Server logs"
          for f in "${{ runner.temp }}/e2e-services-logs"/*.log; do
            [ -f "$f" ] && echo "--- $(basename "$f") ---" && cat "$f" || echo "No server logs found"
          done
          echo "::endgroup::"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-e2e-test-results
          retention-days: 30
          path: |
            report.xml
            ${{ runner.temp }}/e2e-services-logs/
      - name: Record test status
        if: always()
        uses: ./.github/actions/test-status
        with:
          name: Python e2e tests
          phase: finish
          status: ${{ job.status }}

  # Required-check pin: branch protection should reference this aggregator
  # rather than the per-row matrix jobs, so the matrix can grow or shrink
  # without admin intervention. Skipped counts as pass.
  wheel-test-aggregate:
    name: Wheel build + test
    needs: [wheel-test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Record test start
        uses: ./.github/actions/test-status
        with:
          name: Wheel build + test
          phase: start
      - name: Check matrix result
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.wheel-test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "${MATRIX_RESULT}" in
            success|skipped)
              echo "wheel-test matrix: ${MATRIX_RESULT}"
              ;;
            *)
              echo "::error::wheel-test matrix concluded ${MATRIX_RESULT}"
              echo "::error::see per-row results: ${RUN_URL}"
              exit 1
              ;;
          esac
      - name: Record test status
        if: always()
        uses: ./.github/actions/test-status
        with:
          name: Wheel build + test
          phase: finish
          status: ${{ job.status }}

  benchmark-guardrails:
    name: Guardrails plugin benchmark
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout nemo-platform
        uses: actions/checkout@v6
        with:
          path: nemo-platform
      - name: Record test start
        uses: ./nemo-platform/.github/actions/test-status
        with:
          name: Guardrails plugin benchmark
          phase: start
      - name: Checkout NeMo-Guardrails
        uses: actions/checkout@v6
        with:
          repository: NVIDIA/NeMo-Guardrails
          path: NeMo-Guardrails
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Point setup-uv at the nemo-platform checkout so it picks up the
          # repo's `required-version` constraint from pyproject.toml. Other
          # jobs check out into the workspace root and get this implicitly.
          working-directory: nemo-platform
          python-version: "3.11"
          enable-cache: true
      - name: Bootstrap Python environment
        working-directory: nemo-platform
        run: make bootstrap-python
        env:
          PYTORCH_DEPS: cpu
      - name: Run benchmark sweep
        working-directory: nemo-platform
        run: make benchmark-guardrails
        env:
          NEMO_GUARDRAILS_REPO_ROOT: ${{ github.workspace }}/NeMo-Guardrails
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-guardrails-results
          retention-days: 30
          path: |
            nemo-platform/plugins/nemo-guardrails/benchmarks/artifacts/runs/
      - name: Record test status
        if: always()
        uses: ./nemo-platform/.github/actions/test-status
        with:
          name: Guardrails plugin benchmark
          phase: finish
          status: ${{ job.status }}

  coverage-comment:
    name: Post coverage comment
    needs: [python-unit-test, python-integration-test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Download unit test coverage
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: python-unit-test-results
          path: unit-coverage
      - name: Download integration test coverage
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: python-integration-test-results
          path: integration-coverage
      - name: Prepare coverage table
        run: |
          extract_coverage() {
            local xml_file="$1"
            local label="$2"
            if [[ ! -f "${xml_file}" ]]; then
              echo "| **${label}** | N/A | N/A | N/A |"
              return
            fi
            LINE_RATE=$(grep -oP 'line-rate="\K[^"]+' "${xml_file}" | head -1)
            LINE_COVERED=$(grep -oP 'lines-covered="\K[^"]+' "${xml_file}" | head -1)
            LINE_VALID=$(grep -oP 'lines-valid="\K[^"]+' "${xml_file}" | head -1)
            BRANCH_RATE=$(grep -oP 'branch-rate="\K[^"]+' "${xml_file}" | head -1)
            LINE_PCT=$(awk "BEGIN {printf \"%.1f\", ${LINE_RATE} * 100}")
            BRANCH_PCT=$(awk "BEGIN {printf \"%.1f\", ${BRANCH_RATE} * 100}")
            echo "| **${label}** | ${LINE_COVERED}/${LINE_VALID} | ${LINE_PCT}% | ${BRANCH_PCT}% |"
          }

          {
            echo "| Suite | Lines Covered | Line Rate | Branch Rate |"
            echo "| --- | --- | --- | --- |"
            extract_coverage "unit-coverage/coverage.xml" "Unit Tests"
            extract_coverage "integration-coverage/coverage.xml" "Integration Tests"
          } > summary.md
          cat summary.md
        shell: bash
      - name: Post comment
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987
        with:
          header: coverage-report
          path: summary.md

  opa-policy-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Record test start
        uses: ./.github/actions/test-status
        with:
          name: OPA policy tests
          phase: start
      - name: Install OPA 1.8.0
        run: |
          curl -L -o opa https://github.com/open-policy-agent/opa/releases/download/v1.8.0/opa_linux_amd64_static
          chmod +x opa
          ./opa version
      - name: Run test
        run: |
          ./opa test services/core/auth/src/nmp/core/auth/app/policies services/core/auth/src/nmp/core/auth/app/policy_tests services/core/auth/src/nmp/core/auth/assets/static-authz.yaml -v
      - name: Record test status
        if: always()
        uses: ./.github/actions/test-status
        with:
          name: OPA policy tests
          phase: finish
          status: ${{ job.status }}

  # Required-check pin: branch protection should require this final aggregate
  # job. Jobs opt in by uploading a test-status artifact; skipped jobs do not
  # contribute to the aggregate.
  ci-status:
    name: CI status
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Wait for contributing jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Exclude this gate and jobs that intentionally depend on it.
          excluded_jobs=(
            "CI status"
            "Notify CI consumer"
          )

          is_excluded() {
            local job_name="$1"
            local excluded_job
            for excluded_job in "${excluded_jobs[@]}"; do
              if [[ "${job_name}" == "${excluded_job}" ]]; then
                return 0
              fi
            done
            return 1
          }

          while true; do
            mapfile -t unfinished_jobs < <(
              gh api --paginate \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
                --jq '.jobs[] | select(.status != "completed") | .name'
            )

            waiting_jobs=()
            for job_name in "${unfinished_jobs[@]}"; do
              if ! is_excluded "${job_name}"; then
                waiting_jobs+=("${job_name}")
              fi
            done

            if [[ "${#waiting_jobs[@]}" -eq 0 ]]; then
              break
            fi

            echo "Waiting for ${#waiting_jobs[@]} job(s): ${waiting_jobs[*]}"
            sleep 30
          done

      - name: Download test statuses
        uses: actions/download-artifact@v8
        with:
          pattern: test-status-${{ github.run_attempt }}-*
          path: test-status
          merge-multiple: true
      - name: Check test statuses
        shell: bash
        run: |
          set -euo pipefail

          failed=0
          total=0
          keys_file="${RUNNER_TEMP}/test-status-keys.txt"

          declare -A names
          declare -A started
          declare -A finished
          declare -A finish_passed
          declare -A finish_status

          : > "${keys_file}"

          {
            echo "## CI status"
            echo
            echo "| Job | Started | Finished | Passed | Status |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"

          while IFS= read -r -d '' status_file; do
            if [[ "$(jq -r '.run_attempt' "${status_file}")" != "${GITHUB_RUN_ATTEMPT}" ]]; then
              continue
            fi

            key="$(jq -r '.key' "${status_file}")"
            name="$(jq -r '.name' "${status_file}")"
            phase="$(jq -r '.phase' "${status_file}")"
            passed="$(jq -r '.passed' "${status_file}")"
            status="$(jq -r '.status' "${status_file}")"
            total=$((total + 1))

            names["${key}"]="${name}"
            echo "${key}" >> "${keys_file}"

            case "${phase}" in
              start)
                started["${key}"]=true
                ;;
              finish)
                finished["${key}"]=true
                finish_passed["${key}"]="${passed}"
                finish_status["${key}"]="${status}"
                ;;
              *)
                echo "::error title=CI status::${name} has invalid phase ${phase}"
                failed=1
                ;;
            esac
          done < <(find test-status -type f -name '*.json' -print0 | sort -z)

          while IFS= read -r key; do
            [[ -n "${key}" ]] || continue

            name="${names[$key]}"
            has_start=false
            has_finish=false
            passed=false
            status="missing finish"

            if [[ -n "${started[$key]+x}" ]]; then
              has_start=true
            fi
            if [[ -n "${finished[$key]+x}" ]]; then
              has_finish=true
              status="${finish_status[$key]}"
            fi
            if [[ "${has_start}" == "true" && "${has_finish}" == "true" && "${finish_passed[$key]:-false}" == "true" ]]; then
              passed=true
            fi

            printf '| %s | %s | %s | %s | %s |\n' \
              "${name}" "${has_start}" "${has_finish}" "${passed}" "${status}" >> "${GITHUB_STEP_SUMMARY}"

            if [[ "${has_start}" != "true" ]]; then
              echo "::error title=CI status::${name} has a finish marker without a start marker"
              failed=1
            elif [[ "${has_finish}" != "true" ]]; then
              echo "::error title=CI status::${name} started but did not upload a finish marker"
              failed=1
            elif [[ "${passed}" != "true" ]]; then
              echo "::error title=CI status::${name} concluded ${status}"
              failed=1
            fi
          done < <(sort -u "${keys_file}")

          if [[ "${total}" -eq 0 ]]; then
            echo "::error title=CI status::No test status artifacts were found"
            exit 1
          fi

          exit "${failed}"

  notify-ci-consumer:
    name: Notify CI consumer
    needs: [ci-status]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send completion event
        env:
          GH_TOKEN: ${{ secrets.CI_DISPATCH_TOKEN }}
          DISPATCH_REPO: ${{ secrets.CI_DISPATCH_REPO }}
        run: |
          jq -n --arg ref "${GITHUB_SHA}" \
            '{event_type: "ci-passed", client_payload: {ref: $ref}}' \
          | gh api -X POST "/repos/${DISPATCH_REPO}/dispatches" --input -
