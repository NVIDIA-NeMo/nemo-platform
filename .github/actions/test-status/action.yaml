name: Test Status
description: Upload this job's terminal status for the CI status gate

inputs:
  name:
    description: Human-readable check name to show in the CI status summary
    required: true
  status:
    description: "Pass the job.status context from an if: always() step"
    required: true

runs:
  using: composite
  steps:
    - name: Write status
      id: write
      shell: bash
      env:
        STATUS_NAME: ${{ inputs.name }}
        STATUS: ${{ inputs.status }}
      run: |
        set -euo pipefail

        passed=false
        if [[ "${STATUS}" == "success" ]]; then
          passed=true
        fi

        slug="$(printf '%s' "${STATUS_NAME}-${GITHUB_JOB}" \
          | tr '[:upper:]' '[:lower:]' \
          | tr -c 'a-z0-9_.-' '-' \
          | sed -e 's/-\{1,\}/-/g' -e 's/^-//' -e 's/-$//')"
        status_dir="${RUNNER_TEMP}/test-status-${slug}"
        status_file="${status_dir}/${slug}.json"
        artifact_name="test-status-${GITHUB_RUN_ATTEMPT}-${slug}"

        mkdir -p "${status_dir}"
        jq -n \
          --arg name "${STATUS_NAME}" \
          --arg job_id "${GITHUB_JOB}" \
          --arg status "${STATUS}" \
          --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
          --argjson passed "${passed}" \
          '{
            name: $name,
            job_id: $job_id,
            status: $status,
            run_attempt: $run_attempt,
            passed: $passed
          }' > "${status_file}"

        {
          echo "artifact-name=${artifact_name}"
          echo "status-file=${status_file}"
        } >> "${GITHUB_OUTPUT}"

    - name: Upload status
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.write.outputs.artifact-name }}
        path: ${{ steps.write.outputs.status-file }}
        retention-days: 1
        if-no-files-found: error
