[project]
name = "coding-agents"
version = "0.0.1"
description = "Library for invoking coding agents (Claude Code, ...) in headless mode through a uniform abstraction."
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agents"]
