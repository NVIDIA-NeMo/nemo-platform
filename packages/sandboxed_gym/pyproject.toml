[project]
name = "sandboxed-gym"
version = "0.1.0"
description = "Trusted episode broker + sandboxed NeMo-Gym host orchestrator"
readme = "README.md"
authors = [{ name = "NVIDIA", email = "nemo@nvidia.com" }]
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.2",
  "nemo-gym[sandbox]",
]

[project.optional-dependencies]
ray = ["ray>=2.40.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[project.scripts]
sandboxed-gym = "sandboxed_gym.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandboxed_gym"]

[tool.hatch.build.targets.wheel.force-include]
"src/sandboxed_gym/host/gym_host.sh" = "sandboxed_gym/host/gym_host.sh"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
