[project]
name = "nemo-evaluator-sdk"
description = "NeMo Evaluator SDK"
readme = "README.md"
authors = [{ name = "NVIDIA", email = "nemo@nvidia.com" }]
requires-python = ">=3.11,<3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
  "Topic :: Software Development",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "pydantic>=2.10.6",
  "jinja2>=3.1.6",
  "jsonschema>=4.23.0",
  "jsonpath-ng>=1.7.0",
  "pyarrow>=19.0.1",
  "pandas>=1.5.3",
  "openai>=1.61.0",
  "sacrebleu>=2.5.1",
  "rouge_score==0.1.2",
  "ragas==0.4.3",
  "langchain-openai>=1.3.5",
  "langchain-nvidia-ai-endpoints>=1.4.3,<2.0.0",
  "nemo-relay>=0.6.0,<0.7",
  # Fabric's typed config surface (FabricConfig/RuntimeConfig/ModelConfig/the relay models) — what the
  # agent-eval runtimes compose against. The metapackage alone is ~2 MB / 3 packages; it requires
  # nemo-fabric-runtime unconditionally as of rc4, which is why the `runtime` extra it used to expose
  # is gone. The harness adapters are the weight (codex ~299 MB, claude ~231 MB) and stay in the
  # `fabric` extra below, so only *resolving and running* a harness pulls them.
  "nemo-fabric>=0.1.0rc6,<0.2.0",
]
version = "0.0.0"

[dependency-groups]
dev = ["nemo-evaluator-plugin", "nemo-platform-sdk"]

[project.optional-dependencies]
agent-runtimes = [
  "openai-agents[docker]>=0.17.3,<0.18",
]
engine = []
# The native Harbor runtime (HarborAgentTaskRunner / run_harbor_eval) needs `harbor`, which requires
# Python >=3.12 while this workspace floor is >=3.11. The `python_version >= '3.12'` marker (matching
# harbor's own requires-python) scopes the dependency to the 3.12+ fork of the universal lock, so it
# installs on 3.12+ and is simply omitted on 3.11 — no floor bump for the rest of the workspace.
# `harbor` is imported lazily (only inside HarborAgentTaskRunner.run_tasks), so importing the SDK and
# resolving a HarborRunnerTarget stay valid on 3.11; only *executing* a Harbor job needs this extra.
harbor = [
  "harbor>=0.16.1; python_version >= '3.12'",
]
nemo-platform = [
  "nemo-platform-sdk",
]
# NeMo Fabric HARNESS ADAPTERS for the agent-eval runtimes (FabricAgentRuntime /
# FabricContainerRuntime). The Fabric SDK itself is a base dependency above; this extra adds the
# adapters needed to resolve and run a harness.
#
# WHY THE ADAPTERS ARE SPLIT OUT: they are the entire weight. Measured against the base SDK,
# `codex` adds ~299 MB and `claude` ~231 MB — both ship an agent CLI binary — while `deepagents`
# adds ~15 MB but ~50 packages of langchain. The `runtime` extra that carries the typed config
# surface is ~2 MB. Someone installing nemo-evaluator-sdk for LLM-as-judge or RAG metrics should
# not pay half a gigabyte for coding agents they never invoke.
#
# Notes:
#   * Without this extra the SDK still imports, composes a Fabric config, and type-checks against
#     Fabric's real models; only `Fabric.plan`/`run` fail, with `unknown adapter ...; available
#     adapters: []`. Adapter descriptors install as wheel data under
#     <sys.prefix>/share/nemo-fabric/adapters, which is where Fabric discovers them — so an
#     ephemeral overlay env (`uv run --with ...`) hides them; install into the venv instead.
#   * Fabric has not cut a final 0.1.0 yet, so the explicit prerelease in the specifier scopes uv's
#     prerelease allowance to just this package (workspace prerelease = "if-necessary-or-explicit").
#     The floor stays at the oldest rc whose API this runtime targets; the lock tracks the newest.
#   * claude/codex go through the metapackage extras, which pin `nemo-fabric-adapters-*==<same rc>`.
#     That keeps the adapters and the SDK we type against on one version by construction — they were
#     pinned directly through rc5 only because rc4's extras required `nemo-fabric-adapters-*==0.1.0`,
#     a version that was never published. Fixed in rc6.
#   * hermes stays direct because it must omit `[harness]`, and the metapackage's `hermes-agent`
#     extra applies it. `[harness]` pulls `hermes-agent`, which pins `requests==2.33.0` exactly and
#     conflicts with the workspace's `requests>=2.33.1` floor; the adapter alone is what the runtime
#     needs. It cannot drift from the others regardless: every adapter pins
#     `nemo-fabric-adapters-common==<its own version>`, so one shared common forces one shared rc.
#     Python<3.14-gated upstream, which the lock's own <3.14 ceiling already satisfies.
#   * deepagents is omitted to match plugins/nemo-agents (AIRCORE-952: its adapter does not support
#     the Relay observability v2 config Fabric streaming generates). Nothing here exercises it.
fabric = [
  "nemo-fabric[claude,codex]>=0.1.0rc6,<0.2.0",
  "nemo-fabric-adapters-hermes>=0.1.0rc6,<0.2.0; python_version < '3.14'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.vendor-package]
package = "nemo_evaluator_sdk"
package_root = "packages/nemo_evaluator_sdk"
source_module = "nemo_evaluator_sdk"
target_sdk_module = "beta.evaluator"
sdk_optional_dependencies_name = "nemo-evaluator-sdk"
included_paths = ["**/*.py", "**/*.Dockerfile"]
