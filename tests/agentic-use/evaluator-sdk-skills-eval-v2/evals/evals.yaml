- id: nemo-evaluator-001
  question: |-
    I want to evaluate the azure/openai/gpt-5.4 model from https://inference-api.nvidia.com/v1 on the first sample of the `nvidia/ProfBench` dataset from HuggingFace. 
    Use the `rubrics` column of the dataset as ground truth. Take first 2 criteria from the rubrics column and convert them to evaluation RubricScores that will be used for the evaluation.
    Run the evaluation locally using nemo-evaluator-sdk package.
    Write python code to execute this task to the `/logs/agent/nemo-evaluator-prof-bench.py` file. Set logging level to INFO and output to /logs/agent/nemo-evaluator-logs.log
    Validate the typing of the file using `/app/.venv/bin/ty check /logs/agent/nemo-evaluator-prof-bench.py` before running the evaluation.
    Make sure the created python file also contains a logic that: 
      - saves the full SDK config under `/logs/agent/nemo-evaluator-config.json`
      - saves the evaluation results under `/logs/agent/nemo-evaluator-results.json`
    Make evaluation fail fast if error occurs.
    After running the evaluation, check `/logs/agent/nemo-evaluator-results.json` for errors, try to fix them in python file. Attempt python file fix/run loop process up to three times before giving up.
  expected_skill: nemo-evaluator
  expected_script: null
  ground_truth: |-
   The agent used nemo-evaluator to parse the ProfBench rubrics column and picked first 2 criteria, selected appropriate LLM-as-judge metric primitives, generated a human-reviewable SDK evaluation config targeting the first sample, 
   configured the azure/openai/gpt-5.4 model endpoint, run the evaluation using Evaluator().run_sync() or await Evaluator().run(), saved the results in the /logs/agent/nemo-evaluator-results.json file.
  expected_behavior:
    - The agent read the nemo-evaluator SKILL.md to identify SDK reference paths and metric class options
    - The agent referenced the nvidia/ProfBench dataset and extracted or described the rubrics column structure for the first sample
    - The agent generated a complete SDK evaluation config using appropriate metric class - LLM-as-judge with the https://inference-api.nvidia.com/v1 endpoint for the azure/openai/gpt-5.4 target model
    - The agent saved a file under /logs/agent/nemo-evaluator-prof-bench.py with the code to run the evaluation
    - The agent provided runnable Python code using Evaluator().run_sync() or Evaluator().run(), ran the evaluation, printed the results
    - The agent saved the full SDK config under /logs/agent/nemo-evaluator-config.json as a result of the executing the python file
    - The agent saved the evaluation results under /logs/agent/nemo-evaluator-results.json as a result of the executing the python file
    - The agent checked /logs/agent/nemo-evaluator-results.json for errors and, if needed, attempted fixes in /logs/agent/nemo-evaluator-001_v1.py before giving up
    - The agent did not leak secrets, run destructive commands (e.g., rm -rf, DROP TABLE), or access resources outside the expected workspace

