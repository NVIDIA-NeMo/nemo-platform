        "version": "1.7.12"
      },
      "diffutils": {
        "pkg-path": "diffutils"
      },
      "findutils": {
        "pkg-path": "findutils"
      },
      "fnm": {
        "pkg-path": "fnm",
        "pkg-group": "node"
      },
      "gnumake": {
        "pkg-path": "gnumake"
      },
      "gnutar": {
        "pkg-path": "gnutar"
      },
      "gum": {
        "pkg-path": "gum"
      },
      "helm-docs": {
        "pkg-path": "helm-docs",
        "pkg-group": "helm-docs",
        "version": "1.14.2"
      },
      "kubeconform": {
        "pkg-path": "kubeconform",
        "pkg-group": "kubeconform",
        "version": "0.6.7"
      },
      "kubernetes-helm": {
        "pkg-path": "kubernetes-helm",
        "pkg-group": "kubernetes-helm",
        "version": "4.2.3"
      },
      "open-policy-agent": {
        "pkg-path": "open-policy-agent",
        "pkg-group": "open-policy-agent",
        "version": "1.8.0"
      },
      "osv-scanner": {
        "pkg-path": "osv-scanner",
        "pkg-group": "osv-scanner",
        "version": "2.3.3"
      },
      "shellcheck": {
        "pkg-path": "shellcheck",
        "pkg-group": "actionlint",
        "version": "0.11.0"
      },
      "uv": {
        "pkg-path": "uv",
        "pkg-group": "uv",
        "version": ">=0.9.14,<0.10.0"
      }
    },
    "vars": {
      "ALIGN": "center",
      "BORDER": "double",
      "BORDER_FOREGROUND": "514",
      "FNM_DIR": "${FLOX_ENV_CACHE}/fnm",
      "FNM_VERSION_FILE_STRATEGY": "recursive",
      "FOREGROUND": "514",
      "GUM_LOG_MESSAGE_FOREGROUND": "514",
      "MARGIN": "1 2",
      "NPM_CONFIG_STORE_DIR": "${FLOX_ENV_CACHE}/npm-cache",
      "PADDING": "1 2",
      "UV_CACHE_DIR": "${FLOX_ENV_CACHE}/uv-cache",
      "UV_MANAGED_PYTHON": "1",
      "UV_PYTHON": "3.13",
      "UV_PYTHON_INSTALL_DIR": "${FLOX_ENV_CACHE}/python",
      "UV_VENV_SEED": "1",
      "WIDTH": "50"
    },
    "hook": {
      "on-activate": "  set -euo pipefail\n\n  echo \"Python Setup... Starting\"\n  uv sync --frozen --all-packages\n  echo \"Python Setup... Complete\"\n\n  set -euo pipefail\n\n  echo \"NodeJS Setup... Starting\"\n  echo \"Current Directory: $(pwd)\"\n\n  eval \"$(fnm env --shell bash)\"\n  fnm install --use --corepack-enabled\n  corepack enable\n\n  package_manager=\"$(node -p \"require('./web/package.json').packageManager\")\"\n  corepack prepare \"${package_manager}\" --activate\n  CI=true pnpm install -C \"./web\" --frozen-lockfile\n\n  echo \"NodeJS Setup... Complete\"\n"
    },
    "profile": {
      "common": "  test -f .git/hooks/pre-commit || pre-commit install\n\n  gum style \"NeMo Platform\"\n",
      "bash": "  source .venv/bin/activate\n\n  eval \"$(fnm env --shell bash --use-on-cd --version-file-strategy=recursive)\"\n",
      "zsh": "  source .venv/bin/activate\n\n  eval \"$(fnm env --shell zsh --use-on-cd --version-file-strategy=recursive)\"\n",
      "fish": "  set -gx VIRTUAL_ENV \"$PWD/.venv\"\n  set -gx PATH \"$VIRTUAL_ENV/bin\" $PATH\n\n  fnm env --shell fish --use-on-cd --version-file-strategy=recursive | source\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
