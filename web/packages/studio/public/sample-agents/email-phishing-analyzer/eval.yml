# email-phishing-eval.yml — bundled sample seeded into the {agent}-eval fileset.
#
# Evaluates against the deployed agent endpoint. The judge LLM scores each
# generated verdict against the expected label in epa-seeded.jsonl
# (field ``label`` = "phishing" | "benign").
#
# NOTE: the dataset is seeded flat alongside this config in the eval fileset,
# so ``file_path`` is the bare basename (not ``data/epa-seeded.jsonl``).

llms:
  llm:
    _type: openai
    model_name: nvidia-nemotron-3-nano-30b-a3b
    temperature: 0.0
    max_tokens: 512

  judge_llm:
    _type: openai
    model_name: nvidia-nemotron-3-super-120b-a12b
    temperature: 0.0
    max_tokens: 1024

eval:
  general:
    max_concurrency: 1
    output_dir: eval/email-phishing
    dataset:
      _type: jsonl
      file_path: epa-seeded.jsonl
      id_key: gen_subject
      structure:
        question_key: gen_body
        answer_key: label
  evaluators:
    accuracy:
      _type: tunable_rag_evaluator
      llm_name: judge_llm
      default_scoring: true
      default_score_weights:
        coverage: 0.5
        correctness: 0.3
        relevance: 0.2
      judge_llm_prompt: >
        You are an evaluator scoring an email phishing classifier. The expected
        answer is the ground-truth label ("phishing" or "benign"). Score whether
        the generated answer reaches the same verdict as the expected label.
        Rules:
        - Score is a float between 0.0 and 1.0.
        - 1.0 means the generated verdict matches the expected label.
        - Provide a 1-2 sentence reasoning.
