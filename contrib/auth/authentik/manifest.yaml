provider: authentik
mode: compose-ci
compose_file: docker-compose.yml
gateway_base_url: http://127.0.0.1:18080
issuer_url: http://127.0.0.1:19000/application/o/nemo/
discovery_url: http://127.0.0.1:19000/application/o/nemo/.well-known/openid-configuration
nemo_config: config/nemo-auth.yaml
principal_contract:
  subject_claim: sub
  groups_claim: groups
  external_machine_principals_use_service_prefix: false
  internal_service_prefix_reserved: "service:"
human_identity:
  username: akadmin
  expected_email: admin@example.com
machine_identity:
  principal_id: svc-nemo-ci
  expected_groups:
    - nemo-editors
token_acquisition:
  token_endpoint: http://127.0.0.1:19000/application/o/token/
  human_grant:
    grant_type: password
    client_id: nemo-platform
    client_secret: nemo-platform-secret-dev
    username: akadmin
    password: akadmin-dev
    scope: "openid profile email groups"
  machine_grant:
    grant_type: client_credentials
    client_id: nemo-platform
    client_secret: nemo-platform-secret-dev
    username: svc-nemo-ci
    password: svc-nemo-ci-token-secret-dev
    scope: "openid email groups"
healthchecks:
  - kind: http
    url: http://127.0.0.1:19000/application/o/nemo/.well-known/openid-configuration
startup_timeouts:
  healthchecks_seconds: 600
  gateway_seconds: 30
  token_endpoint_seconds: 180
