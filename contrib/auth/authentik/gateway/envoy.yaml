static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: nemo
                      domains: ["*"]
                      request_headers_to_remove:
                        - x-nmp-principal-id
                        - x-nmp-principal-email
                        - x-nmp-principal-groups
                        - x-nmp-principal-on-behalf-of
                        - x-nmp-principal-on-behalf-of-email
                        - x-nmp-principal-on-behalf-of-groups
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: nemo
                http_filters:
                  - name: envoy.filters.http.router
  clusters:
    - name: nemo
      connect_timeout: 5s
      type: LOGICAL_DNS
      load_assignment:
        cluster_name: nemo
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: nemo
                      port_value: 8080
