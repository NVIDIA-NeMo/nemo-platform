# ConfigMap mounted by opensandbox-server-kata.
# Pins BatchSandbox pods onto kata-deploy-labeled H100 nodes.
# RuntimeClass/kata-qemu already carries the same scheduling.nodeSelector;
# repeating it here fails faster and keeps labels visible on the CR.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-batchsandbox-template-kata-qemu
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/part-of: opensandbox
    opensandbox.nvidia.com/isolation-class: kata-qemu
data:
  batchsandbox-template.yaml: |
    metadata:
      labels:
        opensandbox.nvidia.com/isolation-class: kata-qemu
        opensandbox.nvidia.com/runtime: kata-qemu
    spec:
      replicas: 1
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 60
          # Sandbox pods are built from this template by the OpenSandbox server
          # not by the jobs controller, so neither the jobs controller's
          # image_pull_secrets nor the chart's top-level imagePullSecrets reaches them.
          # This name is required as written. If your pull Secret is named
          # differently, change it here before kubectl apply. The Secret must
          # exist in the sandbox / job namespace.
          imagePullSecrets:
            - name: nvcrimagepullsecret
          # Example nodeSelector matching kata-deploy on H100 + NFD VMX nodes.
          # Replace instance-type and CPUID labels for your cluster.
          nodeSelector:
            katacontainers.io/kata-runtime: "true"
            node.kubernetes.io/instance-type: BM.GPU.H100.8
            feature.node.kubernetes.io/cpu-cpuid.VMX: "true"
          tolerations:
            - operator: Exists
